<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herald Test Lab</title>
<style>
/* Layout: top bar, a rail of pretend source systems on the left, one page per system with its cases, a case log at the end. */
:root{
  color-scheme:light;
  --bg:#f5f6f8; --surface:#ffffff; --sunk:#eef0f3; --ink:#1b1f24; --muted:#5d6672; --line:#d9dde3;
  --accent:#8a3ffc; --accent-ink:#ffffff; --accent-soft:#f1e9fe;
  --crit:#b3261e; --crit-soft:#fdeceb; --warn:#7a5200; --warn-soft:#fdf3d3; --ok:#1c6b3c; --ok-soft:#e3f4e9; --info:#0f5cad; --info-soft:#e6f1fb;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font)}
h1,h2,h3,p,ul,ol,pre{margin:0;padding:0} ul,ol{list-style:none}
h1{font:600 26px/1.2 var(--font)} h2{font:600 18px/1.25 var(--font);display:flex;gap:8px;align-items:center} h3{font:600 16px/1.3 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;fill:currentColor;flex:none;vertical-align:-4px} .ic.sm{width:16px;height:16px;vertical-align:-3px} .ic.lg{width:26px;height:26px}
.muted{color:var(--muted)} .note{font-size:13px;color:var(--muted)} .num{font-variant-numeric:tabular-nums}
.lab{font:600 12px/1.3 var(--font);color:var(--muted)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:10px;max-width:1280px;margin:0 auto}
.brand{display:flex;gap:10px;align-items:center;margin-right:auto;min-width:0}
.brand .fi{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center}
.brand b{font:700 20px/1 var(--font)}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;max-width:1280px;margin:0 auto;padding-block:20px 80px}
#nav{display:flex;flex-direction:column;gap:2px;align-self:start;position:sticky;top:70px}
.navb{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;line-height:1.3;width:100%}
.navb:hover{background:var(--sunk)} .navb .ic{color:var(--muted);margin-top:1px}
.navb span{display:flex;flex-direction:column;min-width:0;flex:1} .navb small{color:var(--muted);font-size:12px}
.navb[aria-current="page"]{background:var(--accent-soft);color:var(--accent)} .navb[aria-current="page"] .ic{color:var(--accent)}
.nb{font:600 11px var(--font);border-radius:9px;padding:1px 7px;background:var(--sunk);color:var(--ink);align-self:center}
#main{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:860px){ .shell{grid-template-columns:minmax(0,1fr);gap:12px} #nav{position:static;flex-direction:row;overflow-x:auto} .navb{width:auto;white-space:nowrap} .navb small{display:none} }
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 1px 2px rgba(27,31,36,.05)}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center} .grow{flex:1 1 220px;min-width:0} .stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)} .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed} .btn.danger{color:var(--crit);border-color:var(--crit)}
.in{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);width:100%;min-width:0} select.in{width:auto} textarea.in{font:13px/1.45 var(--mono);min-height:220px;resize:vertical}
.sys{display:flex;gap:14px;align-items:flex-start}
.sys .fi{width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.case{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.case.pass{border-color:var(--ok)} .case.fail{border-color:var(--crit)}
.expect{display:flex;gap:8px;align-items:flex-start;font-size:14px} .expect .ic{color:var(--muted);margin-top:2px}
.badge{font:600 12px/1.2 var(--font);padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.no{background:var(--crit-soft);color:var(--crit)} .badge.run{background:var(--info-soft);color:var(--info)}
.steps{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:8px;padding:10px 12px}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;font-size:14px}
.steps small{display:block;color:var(--muted);font-size:13px}
.t-ok{color:var(--ok)} .t-no{color:var(--crit)} .t-wait{color:var(--muted)}
details summary{cursor:pointer;color:var(--info);font-size:13px;font-weight:600}
pre{background:var(--sunk);border-radius:6px;padding:10px 12px;overflow-x:auto;font:12.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
code{font:12.5px var(--mono);background:var(--sunk);padding:1px 4px;border-radius:3px}
.banner{border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:10px 14px;font-size:14px}
.scroll-x{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font:600 12px var(--font);color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top} tr:last-child td{border-bottom:0}
.kv{display:grid;grid-template-columns:minmax(90px,auto) minmax(0,1fr);gap:4px 14px} .kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.stats{display:flex;gap:10px;flex-wrap:wrap} .stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
.stat b{display:block;font:600 24px/1.1 var(--font);font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1b1f24;color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;z-index:9;max-width:90vw}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:100 700;font-display:swap;src:url(brand/fonts/ibm-plex-sans.ttf) format("truetype")}
:root{--font:"IBM Plex Sans",ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif}
</style>
</head>

<script>
(function(){
'use strict';
/* The test lab plays the source systems from the hackathon brief. Each case is sent through the
   system's real route into Herald (its Kafka topic, the webhook, the log source), then the lab
   watches what Herald did and compares it with what should happen. Results go into a case log. */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,c)=>`<svg class="ic${c?' '+c:''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const clone=o=>JSON.parse(JSON.stringify(o));
const nf=n=>Number(n).toLocaleString('en-US');
const pad=n=>String(n).padStart(2,'0');
const clock=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cap=s=>String(s).charAt(0).toUpperCase()+String(s).slice(1);
const joinAnd=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const uid=()=>Math.random().toString(36).slice(2,7).toUpperCase();
const CH={phone:'phone call',sms:'text message',email:'email',ui:'the Herald screen'};

const SETTLE='settlements-order-settlement-failed',ANNA='anna-payments-critical',RATES='rates-large-trade-rejected',PRICING='pricing-engine-warnings';
const now=()=>new Date().toISOString();
const SYSTEMS=[
  {id:'workflow',name:'Workflow engine',icon:'arrow_sync',source:'workflow-events',via:'a message broker (Kafka topic workflow.events)',
   about:'Runs business workflows such as order settlement, and reports every failure and success.',
   cases:[
    {id:'wf-fail',title:'An order settlement fails in production',note:'The example from the brief.',sample:'workflow_failed',
     expect:{alert:true,rule:SETTLE,text:'Settlements get one alert. The on-call person is phoned and texted.'}},

/* No identity headers: in demo mode the service treats the lab as an administrator, so it can see every team's outcome. */
async function api(path,body){const r=await fetch(path,body!==undefined?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});
  let d=null;try{d=await r.json();}catch(e){}
  if(!r.ok){const x=d&&d.detail;throw new Error(typeof x==='string'?x:'Herald answered '+r.status);}return d;}
function pname(ref){ref=String(ref||'');if(ref.indexOf('person:')===0){const p=S.people[ref.slice(7)];return p?p.name:cap(ref.slice(7));}
  if(ref.indexOf('team:')===0){const t=S.teams[ref.slice(5)];return (t?t.name:cap(ref.slice(5)))+' team';}return ref;}
function toast(t){const n=$('toast');n.textContent=t;n.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{n.hidden=true;},5000);}

/* Plain-language reason a rule did not match, from the failing condition the service names. */
function flabel(f){f=String(f||'');if(f.charAt(0)==='@')return {'@severity':'severity','@service':'service','@type':'event type','@source':'source'}[f]||f.slice(1);
  let p=f.split('.');while(p.length>1&&['payload','data','labels','meta','annotations'].includes(p[0]))p.shift();return p.join(' ').replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').toLowerCase();}
const vfmt=v=>Array.isArray(v)?v.join(' or '):typeof v==='number'?nf(v):v&&typeof v==='object'?JSON.stringify(v):String(v==null?'':v);
function needText(n){return {eq:'needs to be '+vfmt(n.value),ne:'must not be '+vfmt(n.value),gt:'needs to be over '+vfmt(n.value),gte:'needs at least '+vfmt(n.value),lt:'needs to be under '+vfmt(n.value),
  lte:'needs at most '+vfmt(n.value),in:'needs to be one of '+vfmt(n.value),contains:'needs to contain '+vfmt(n.value),glob:'needs to match '+vfmt(n.value),regex:'needs to match '+vfmt(n.value),
  exists:'needs a value',severity_gte:'needs to be '+String(n.value).toLowerCase()+' or worse'}[n.op]||'';}
function failText(l){const n=l&&l[0];if(!n)return 'did not match';if(n.not)return 'an excluded condition is true';return flabel(n.field)+' is '+(n.missing||n.actual==null?'missing':vfmt(n.actual))+', and '+needText(n);}

const alerts=()=>api('/api/alerts?limit=300');
function diff(before,after){const by={};before.forEach(a=>{by[a.id]=a;});const out=[];
  after.forEach(a=>{const b=by[a.id];if(!b)out.push({a:a,isNew:true,added:a.count});else if(b.count!==a.count||b.status!==a.status)out.push({a:a,isNew:false,added:a.count-b.count});});return out;}

/* Send one case and follow it: what Herald decided (from the service), then what really changed. */
async function follow(source,event,count,expect,rec){
  const step=(ok,text,sub)=>{rec.steps.push({ok:ok,text:text,sub:sub});render();};
  const before=await alerts();
  const sent=await api('/api/sim/send',{source:source,event:event,count:count||1});
  step(true,(sent.sent>1?nf(sent.sent)+' events were':'The event was')+' sent to Herald');
  const ex=await api('/api/events/explain',{event:event,source:source});
  const fired=[],closed=[];let nearest=null;
  ex.items.forEach(it=>it.rules.filter(r=>r.enabled).forEach(r=>{if(r.closes)closed.push(r);else if(r.passed)fired.push(r);
    else if(!nearest||r.failed_because.length<nearest.failed_because.length)nearest=r;}));
  rec.attrs=ex.items[0].attrs;rec.rules=ex.items[0].rules;
  if(ex.items.length>1)step(true,'Herald split it into '+ex.items.length+' separate events');
  if(fired.length)step(true,'A rule matched: “'+[...new Set(fired.map(r=>r.name))].join('”, “')+'”','It belongs to '+pname(fired[0].owner));
  else if(closed.length)step(true,'Herald read it as “the problem is over”','For the rule “'+closed[0].name+'”');
  else step(true,'No rule matched',nearest?'Closest rule: “'+nearest.name+'”. '+cap(failText(nearest.failed_because))+'.':'There are no rules yet.');

  const ids=fired.concat(closed).map(r=>r.id);let changes=[];const wantCount=expect&&expect.count;
  const tries=fired.length||closed.length?(wantCount?40:14):6;
  for(let i=0;i<tries;i++){await sleep(400);changes=diff(before,await alerts());
    const mine=changes.filter(c=>ids.includes(c.a.rule_id));
    if(!ids.length)continue;                       /* nothing should change: keep watching for the full window */
    if(mine.length&&(!wantCount||mine.some(c=>c.added>=wantCount)))break;
    if(closed.length&&!fired.length&&!before.some(a=>ids.includes(a.rule_id)&&a.status!=='resolved'))break;}
  const mine=changes.filter(c=>ids.includes(c.a.rule_id));const hit=mine.find(c=>!wantCount||c.added>=wantCount)||mine[0];
  let actual,verdict=null;
  if(hit){let a=hit.a;
    if(a.status==='resolved'&&!hit.isNew&&closed.length){step(true,'The open alert was closed automatically','“'+a.title+'”');actual='The open alert closed by itself';}
    else if(hit.isNew){await sleep(1300);a=(await alerts()).find(x=>x.id===a.id)||a;
      step(true,'One new alert was opened'+(a.count>1?', showing ×'+nf(a.count):''),'“'+a.title+'” · '+a.severity);
      const told=(a.deliveries||[]).map(d=>pname(d.recipient)+' by '+(CH[d.channel]||d.channel)+(d.status==='sent'?'':' ('+d.status+')'));
      step(true,told.length?'Told: '+joinAnd(told):'Nobody is set to be told');
      actual='New alert'+(a.count>1?' ×'+nf(a.count):'')+(told.length?'; told '+joinAnd(told):'');}
    else{step(true,'It was added to the alert that is already open (now ×'+nf(a.count)+')','Nobody was told again: one problem, one alert.');actual='Counted on the open alert (now ×'+nf(a.count)+'), nobody told again';}
    rec.alert={id:a.id,key:a.key};
  }else if(closed.length&&!fired.length){step(true,'There was no open alert to close');actual='Nothing to close';}
  else if(fired.length){step(false,'No alert changed within a few seconds');actual='A rule matched but no alert appeared';}
  else{step(true,'Nobody was disturbed: no alert changed');actual='No alert';}
  if(expect){
    if(expect.alert===true)verdict=!!hit&&hit.a.rule_id===expect.rule&&hit.a.status!=='resolved'&&(!wantCount||hit.added>=wantCount);
    else if(expect.closes)verdict=closed.some(r=>r.id===expect.rule)&&(!hit||hit.a.status==='resolved');
    else verdict=!fired.length&&!closed.length;}
  rec.actual=actual;rec.verdict=verdict;rec.running=false;}

async function runCase(sys,c){if(S.busy)return;S.busy=true;const u=uid();
  let ev=c.build?c.build(u):clone(S.samples[c.sample]||null);
  const rec=S.results[c.id]={steps:[],running:true,verdict:null,at:Date.now()};
  if(ev===null){rec.steps.push({ok:false,text:'The sample events are not available from the service.'});rec.running=false;rec.verdict=false;S.busy=false;render();return;}
  if(c.edit)c.edit(ev,u);rec.sent=ev;render();
  try{await follow(sys.source,ev,c.count,c.expect,rec);}catch(e){rec.steps.push({ok:false,text:e.message});rec.running=false;rec.verdict=false;rec.actual='Error: '+e.message;}
  S.log.unshift({at:rec.at,system:sys.name,title:c.title,expected:c.expect.text,actual:rec.actual||'',verdict:rec.verdict});saveLog();S.busy=false;render();}
async function runAll(sys){for(const c of sys.cases){await runCase(sys,c);await sleep(700);}}
async function runCustom(){if(S.busy)return;let ev;const text=S.custom.text.trim();
  if(!text){toast('Paste an event first.');return;}
  try{ev=JSON.parse(text);}catch(e){ev=text;}                    /* not JSON: send it as a text line, like a log */
  S.busy=true;const rec=S.custom.result={steps:[],running:true,verdict:null,at:Date.now(),sent:ev};render();
  try{await follow(S.custom.source,ev,1,null,rec);}catch(e){rec.steps.push({ok:false,text:e.message});rec.running=false;rec.actual='Error: '+e.message;}
  S.log.unshift({at:rec.at,system:'A new system ('+S.custom.source+')',title:typeof ev==='string'?ev.slice(0,60):(rec.attrs&&rec.attrs.type)||'Custom event',expected:'—',actual:rec.actual||'',verdict:null});saveLog();S.busy=false;render();}

function render(){
  $('gwBtn').innerHTML=S.down?ic('plug_connected','sm')+'Bring the phone and text gateway back':ic('warning','sm')+'Simulate an outage: phone and text gateway down';
  $('gwBtn').className='btn'+(S.down?' pri':'');
  $('nav').innerHTML=SYSTEMS.map(x=>{const n=x.cases.filter(c=>S.results[c.id]&&S.results[c.id].verdict===true).length;
      return `<button class="navb" data-act="nav" data-view="${x.id}" ${S.view===x.id?'aria-current="page"':''}>${ic(x.icon)}<span><b>${esc(x.name)}</b><small>${x.custom?'Paste any event':x.cases.length+' cases · '+esc(x.source)}</small></span>${n?`<span class="nb">${n}/${x.cases.length}</span>`:''}</button>`;}).join('')
    +`<button class="navb" data-act="nav" data-view="log" ${S.view==='log'?'aria-current="page"':''}>${ic('table')}<span><b>Case log</b><small>What was sent and what happened</small></span>${S.log.length?`<span class="nb">${S.log.length}</span>`:''}</button>`;
  if(S.error){$('main').innerHTML=`<section class="card"><h1>Herald is not answering</h1><p class="muted">${esc(S.error)}</p><p class="muted">Start it with <code>docker compose up --build</code> and reload this page.</p></section>`;return;}
  if(!S.ready){$('main').innerHTML='<p class="muted">Loading…</p>';return;}
  const a=document.activeElement,fid=a&&a.id;let ss=null,se=null;try{ss=a.selectionStart;se=a.selectionEnd;}catch(e){}
  const sys=SYSTEMS.find(x=>x.id===S.view);
  $('main').innerHTML=(S.down?'<div class="banner"><b>The phone and text gateway is down.</b> Calls and texts will retry and go out when it returns; nothing is dropped. Watch “Sent messages” in Herald.</div>':'')
    +(S.view==='log'?viewLog():sys.custom?viewCustom(sys):viewSystem(sys));
  if(fid){const n=$(fid);if(n&&n!==document.activeElement){try{n.focus();if(ss!=null&&n.setSelectionRange)n.setSelectionRange(ss,se);}catch(e){}}}
}
const CLOUDEVENT={specversion:'1.0',id:'b7d1c2e0-41aa',source:'/scheduler/eod',type:'com.example.batch.job.failed',time:'2026-10-23T22:05:11Z',subject:'eod-position-reconciliation',
  data:{jobId:'JOB-77120',attempt:3,exitCode:137,env:'prod',owner:'settlements',durationSec:5412,lastLog:'Killed: out of memory'}};
const ACT={
  nav(el){S.view=el.dataset.view;try{location.hash=S.view;}catch(e){}window.scrollTo(0,0);},
  run(el){const sys=SYSTEMS.find(x=>x.id===el.dataset.sys);runCase(sys,sys.cases.find(c=>c.id===el.dataset.case));},
  runAll(el){runAll(SYSTEMS.find(x=>x.id===el.dataset.sys));},
  runCustom(){runCustom();},
  customExample(el){S.custom.text=JSON.stringify(el.dataset.k==='cloudevent'?CLOUDEVENT:S.samples[el.dataset.k]||{},null,2);S.custom.result=null;},
  async gateway(){try{const r=await api('/api/sim/gateway',{down:!S.down});S.down=!!r.down;toast(S.down?'The gateway is down. Send a case that phones or texts someone.':'The gateway is back. Waiting messages go out on their next retry.');}catch(e){toast(e.message);}render();},
  copyLog(){const rows=['| Time | System | Case | Should happen | What happened | Result |','|---|---|---|---|---|---|'].concat(S.log.slice().reverse().map(x=>'| '+[clock(x.at),x.system,x.title,x.expected,x.actual,x.verdict===true?'As expected':x.verdict===false?'NOT as expected':'Observed'].map(v=>String(v).replace(/\|/g,'/')).join(' | ')+' |')).join('\n');
    const fb=()=>toast('Copying is blocked here. Select the table and copy it by hand.');try{navigator.clipboard.writeText(rows).then(()=>toast('Copied as a Markdown table.'),fb);}catch(e){fb();}},
  clearLog(){S.log=[];S.results={};saveLog();}
};
document.addEventListener('click',e=>{const el=e.target.closest?e.target.closest('[data-act]'):null;if(!el||el.disabled||!ACT[el.dataset.act])return;ACT[el.dataset.act](el);render();});
document.addEventListener('input',e=>{if(e.target.id==='customText')S.custom.text=e.target.value;});
document.addEventListener('change',e=>{if(e.target.id==='customSource'){S.custom.source=e.target.value;render();}});
window.addEventListener('hashchange',()=>{const v=location.hash.replace('#','');if(v==='log'||SYSTEMS.some(x=>x.id===v)){S.view=v;render();}});
(async function boot(){render();
  try{const [samples,dir,sources,phone]=await Promise.all([api('/api/sim/samples'),api('/api/directory'),api('/api/sources'),api('/api/sim/phone').catch(()=>({down:false}))]);
    S.samples=samples;dir.people.forEach(p=>{S.people[p.id]=p;});dir.teams.forEach(t=>{S.teams[t.id]=t;});S.sources=sources;S.down=!!phone.down;
    S.custom.text=JSON.stringify(samples.unseen_margin_call||CLOUDEVENT,null,2);S.ready=true;
  }catch(e){S.error=e.message||'The service did not answer.';}
  const v=location.hash.replace('#','');if(v==='log'||SYSTEMS.some(x=>x.id===v))S.view=v;render();})();
})();
</script>
