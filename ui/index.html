<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>The Herald</title>
<style>
/* Layout: sticky top bar (team, role, simulate), left rail of screens on desktop that becomes a tab strip on phones,
   one working column, alert and event detail in a right-hand drawer. */
:root{
  color-scheme:light;
  --bg:#f5f6f8; --surface:#ffffff; --sunk:#eef0f3; --ink:#1b1f24; --muted:#5d6672; --line:#d9dde3;
  --accent:#0f6cbd; --accent-ink:#ffffff; --accent-soft:#e6f1fb;
  --crit:#b3261e; --crit-soft:#fdeceb; --err:#b5480b; --err-soft:#fdeee2; --warn:#7a5200; --warn-soft:#fdf3d3;
  --info:#0f5cad; --info-soft:#e6f1fb; --ok:#1c6b3c; --ok-soft:#e3f4e9; --grey:#5d6672; --grey-soft:#eef0f3;
  --scrim:rgba(27,31,36,.4); --shadow:0 10px 32px rgba(27,31,36,.14);
  --font-display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
table{font:inherit;color:inherit;border-collapse:collapse;width:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol,dl,dd,pre,fieldset{margin:0;padding:0}
ul,ol{list-style:none}
fieldset{border:0;min-width:0}
h1{font:700 26px/1.1 var(--font-display);letter-spacing:.005em;text-wrap:balance}
h2{font:600 17px/1.2 var(--font-display);letter-spacing:.01em;text-wrap:balance}
h3{font:600 14.5px/1.3 var(--font-body);overflow-wrap:anywhere}
code,pre,.mono{font-family:var(--font-mono);font-size:12.5px}
code{background:var(--sunk);padding:1px 4px;border-radius:3px;overflow-wrap:anywhere}
pre{background:var(--sunk);border-radius:6px;padding:10px 12px;overflow-x:auto;line-height:1.5;white-space:pre}
pre.wrap{white-space:pre-wrap;overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.lab{font:600 11px/1.3 var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:10px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:18px;height:18px;background:var(--accent);transform:rotate(45deg);border-radius:3px;flex:none}
.brand b{font:700 21px/1 var(--font-display);letter-spacing:.03em}
.proto{font:500 10.5px/1.2 var(--font-mono);color:var(--muted);border:1px dashed var(--muted);padding:3px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.06em}
.sels{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sels label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.sim{position:relative}
#simMenu{position:absolute;right:0;top:calc(100% + 6px);width:min(350px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:6px;z-index:12;max-height:72vh;overflow:auto}
.mh{padding:8px 10px 4px}
.mi{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;padding:7px 10px;border:0;background:none;border-radius:6px;cursor:pointer}
.mi:hover{background:var(--sunk)}
.mi small{color:var(--muted);font-size:12px}
.mi.tog{flex-direction:row;align-items:center;gap:10px}
.mi.tog>span:last-child{display:flex;flex-direction:column}
.sw{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface)}
.mi[aria-checked="true"] .sw{background:var(--accent)}
.mi[aria-checked="true"] .sw::after{left:16px}
@media (max-width:760px){ .sels{order:3;width:100%} }

/* shell */
.shell{display:grid;grid-template-columns:186px minmax(0,1fr);gap:26px;padding-block:20px 96px;max-width:1280px;margin:0 auto}
#nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;display:flex;flex-direction:column;gap:2px}
.navb{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:0;background:none;border-radius:6px;text-align:left;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.navb:hover{color:var(--ink)}
.navb[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nb{font:600 11px var(--font-mono);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:1px 6px;color:var(--ink)}
#main{min-width:0;display:flex;flex-direction:column;gap:16px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:12px;padding-block:10px 96px}
  #nav{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-weight:500;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.warn{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font-weight:500}
.in{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0;max-width:100%;width:100%}
select.in{width:auto}
textarea.in{resize:vertical;min-height:64px;line-height:1.4}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.segb{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.row.top-al{align-items:flex-start}
.grow{flex:1 1 220px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.note{font-size:12.5px;color:var(--muted)}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:6px;padding:8px 12px;font-size:13px}
.banner.info{border-color:var(--info);background:var(--info-soft)}
.banner.ok{border-color:var(--ok);background:var(--ok-soft)}
.scroll-x{overflow-x:auto}
th{text-align:left;font:600 11px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}

/* severity, pills, chips */
.sev{display:inline-flex;gap:5px;align-items:center;font:600 11.5px/1.2 var(--font-body);letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:4px;white-space:nowrap}
.sev-critical{background:var(--crit-soft);color:var(--crit)} .sev-error{background:var(--err-soft);color:var(--err)}
.sev-warning{background:var(--warn-soft);color:var(--warn)} .sev-info{background:var(--info-soft);color:var(--info)}
.sev-debug{background:var(--grey-soft);color:var(--grey)}
.c-red{--c:var(--crit);--cs:var(--crit-soft)} .c-orange{--c:var(--err);--cs:var(--err-soft)} .c-amber{--c:var(--warn);--cs:var(--warn-soft)}
.c-blue{--c:var(--info);--cs:var(--info-soft)} .c-green{--c:var(--ok);--cs:var(--ok-soft)} .c-grey{--c:var(--grey);--cs:var(--grey-soft)}
.tile{width:36px;height:36px;border-radius:7px;display:grid;place-items:center;background:var(--cs);color:var(--c);font-size:16px;flex:none;border:1px solid var(--c)}
.count{font:600 12.5px/1.2 var(--font-mono);background:var(--ink);color:var(--surface);padding:2px 8px;border-radius:10px;font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:500;padding:2px 8px;border-radius:10px;border:1px solid var(--line);white-space:nowrap}
.pill.firing{border-color:var(--crit);color:var(--crit)} .pill.acked{border-color:var(--info);color:var(--info)} .pill.resolved{border-color:var(--ok);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.chip.delivered{color:var(--ok);border-color:var(--ok)}
.chip.retrying,.chip.pending{color:var(--warn);background:var(--warn-soft);border-color:var(--warn)}
.chip.parked{color:var(--crit);background:var(--crit-soft);border-color:var(--crit)}
.badge{font:600 11px/1.2 var(--font-body);padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.ap{background:var(--warn-soft);color:var(--warn)} .badge.ai{background:var(--info-soft);color:var(--info)} .badge.ok{background:var(--ok-soft);color:var(--ok)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ok);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
@media (prefers-reduced-motion:no-preference){ .dot.pulse{animation:pulse 1.6s ease-in-out infinite} }
@keyframes pulse{50%{opacity:.25}}

/* feed */
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.alert:hover{border-color:var(--muted)}
.alert.st-resolved{background:var(--sunk)}
.al-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.al-actions{display:flex;flex-direction:column;gap:6px}
@media (max-width:640px){ .alert{grid-template-columns:auto minmax(0,1fr)} .al-actions{grid-column:1/-1;flex-direction:row} }
.evrow{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.evrow:last-child{border-bottom:0}
.empty{border:1px dashed var(--muted);border-radius:8px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}

/* drawer */
#scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
#drawerHead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#drawerBody{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:20px;min-height:0;flex:1}
.sec{display:flex;flex-direction:column;gap:8px;min-width:0}
.kv{display:grid;grid-template-columns:minmax(90px,auto) minmax(0,1fr);gap:4px 14px}
.kv dt{color:var(--muted)} .kv dd{overflow-wrap:anywhere}
.kv dd.hi{color:var(--crit);font-weight:600}
.step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.sn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font:600 12px var(--font-mono);color:var(--muted)}
.sn.done{background:var(--ok);border-color:var(--ok);color:var(--surface)} .sn.failed{background:var(--crit);border-color:var(--crit);color:var(--surface)}
.sn.running,.sn.awaiting{border-color:var(--warn);color:var(--warn)}
.sb{display:flex;flex-direction:column;gap:6px;min-width:0}
.out{font:12.5px/1.45 var(--font-mono);background:var(--sunk);border-radius:5px;padding:6px 8px;overflow-wrap:anywhere}
.out.bad{color:var(--crit)}
.why li{display:flex;gap:8px;align-items:baseline;padding:2px 0;flex-wrap:wrap}
.why ul{padding-left:20px}
.tick{font-weight:700;width:14px;flex:none}
.tick.y{color:var(--ok)} .tick.n{color:var(--crit)}
.tl li{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;padding:3px 0}

/* rules */
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.rule-side{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
@media (max-width:640px){ .rule{grid-template-columns:minmax(0,1fr)} }
.stat{display:flex;flex-direction:column;min-width:64px}
.stat b{font:600 15px var(--font-mono);font-variant-numeric:tabular-nums}
.ed-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1040px){ .ed-grid{grid-template-columns:minmax(0,1fr)} }
.ed-form,.ed-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.wcard{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px}
.wkey{font:700 15px/1.2 var(--font-display);color:var(--accent);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
@media (max-width:520px){ .wcard{grid-template-columns:minmax(0,1fr);gap:6px} }
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>span{font-size:12.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.grp{border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.grp .grp{background:var(--surface)}
.cond{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.1fr) auto;gap:6px;align-items:center}
@media (max-width:560px){ .cond{grid-template-columns:minmax(0,1fr) auto} .cond>.in{grid-column:1} .cond>.x{grid-column:2;grid-row:1} }
.x{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:30px;height:30px;cursor:pointer;line-height:1}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.ntf{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px}
.sentence{font:500 15.5px/1.45 var(--font-body);text-wrap:pretty}
.jf{border:0;background:none;padding:0 2px;margin:0;font:inherit;color:inherit;cursor:pointer;border-radius:3px;text-align:left}
.jf:hover{background:var(--accent-soft);color:var(--accent)}
.match li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px;padding:3px 0;font-size:13px}
.prev{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.smsb{background:var(--sunk);border-radius:12px;padding:8px 10px;font-size:13px;overflow-wrap:anywhere;max-width:300px}
.var{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 3px;font-family:var(--font-mono);font-size:12.5px}

/* runbooks */
.rb-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px}
@media (max-width:900px){ .rb-grid{grid-template-columns:minmax(0,1fr)} }
.rstep{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.rstep:last-child{border-bottom:0}

/* deliveries */
.dl-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){ .dl-grid{grid-template-columns:minmax(0,1fr)} }
.phone{border:2px solid var(--ink);border-radius:24px;padding:12px;background:var(--sunk);display:flex;flex-direction:column;gap:10px;max-width:360px;width:100%}
.thread{height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px}
.bub{max-width:88%;padding:7px 10px;border-radius:12px;font-size:13px;overflow-wrap:anywhere}
.bub.in{background:var(--surface);align-self:flex-start;border:1px solid var(--line)}
.bub.out{background:var(--accent);color:var(--accent-ink);align-self:flex-end}
.bub small{display:block;opacity:.75;font-size:11px;margin-top:2px}
.call{background:var(--surface);border:1px solid var(--ok);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.key{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.key b{font:600 16px var(--font-mono)} .key small{font-size:10px;color:var(--muted);min-height:11px}
.key.act{border-color:var(--accent)} .key.act small{color:var(--accent)}
.mail{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 10px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.mrow[aria-pressed="true"]{background:var(--accent-soft)}
.mbody{padding:12px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.ptabs{display:flex;gap:4px;flex-wrap:wrap}
.ptab{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;color:var(--muted)}
.ptab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}

/* preferences, connect */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.ob{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
.obn{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 13px var(--font-mono)}
.obn.done{background:var(--ok);color:var(--surface)}
.clockbox{font:600 22px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.wait{display:inline-flex;align-items:center;gap:8px;font-weight:500;color:var(--warn)}
.wait .dot{background:var(--warn)}
.wait.got{color:var(--ok)} .wait.got .dot{background:var(--ok)}

/* toasts */
#toasts{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;display:flex;gap:12px;align-items:center;max-width:600px;box-shadow:var(--shadow);font-size:13.5px}
.toast button{border:1px solid currentColor;background:none;color:inherit;border-radius:5px;padding:3px 9px;cursor:pointer;white-space:nowrap;font-weight:600}

/* ---- light redesign: larger type, icons, plain language, two levels of detail ---- */
body{font:15px/1.5 var(--font-body)}
h1{font:600 28px/1.15 var(--font-display);letter-spacing:-.01em}
h2{font:600 18px/1.25 var(--font-display);letter-spacing:0;display:flex;align-items:center;gap:8px}
h3{font:600 16px/1.3 var(--font-body)}
.ic{width:20px;height:20px;fill:currentColor;flex:none;vertical-align:-4px}
.ic.sm{width:16px;height:16px;vertical-align:-3px} .ic.lg{width:26px;height:26px}
body:not(.tech) .tech-only{display:none!important}
body.tech .simple-only{display:none!important}
.mark{background:var(--accent)} .brand b{font:700 20px/1 var(--font-display);letter-spacing:0}
.tagline{color:var(--muted);font-size:13px}
.sels label{font-size:13px}
.shell{grid-template-columns:248px minmax(0,1fr);gap:30px}

/* ---- Atlassian Design System conventions: tokens, lozenges, dynamic table, tabs, section message,
        empty state, modal, breadcrumbs, user, tile, toggle, progress tracker ---- */
:root{
  --bg:#ffffff; --surface:#ffffff; --sunk:#f7f8f9; --ink:#172b4d; --muted:#626f86; --line:#dcdfe4;
  --accent:#0c66e4; --accent-ink:#ffffff; --accent-soft:#e9f2ff;
  --crit:#ae2e24; --crit-soft:#ffeceb; --err:#ae2e24; --err-soft:#ffeceb; --warn:#7f5f01; --warn-soft:#fff7d6;
  --info:#0055cc; --info-soft:#e9f2ff; --ok:#216e4e; --ok-soft:#dcfff1; --grey:#44546f; --grey-soft:#f1f2f4;
  --neutral:rgba(9,30,66,.06); --neutral-h:rgba(9,30,66,.14); --scrim:rgba(9,30,66,.54);
  --shadow:0 8px 12px rgba(9,30,66,.15),0 0 1px rgba(9,30,66,.31);
  --font-body:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,system-ui,"Helvetica Neue",sans-serif;
  --font-display:var(--font-body);
}
body{font:14px/1.43 var(--font-body);background:var(--bg)}
h1{font:600 24px/28px var(--font-body);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
h2{font:600 16px/20px var(--font-body)} h3{font:600 14px/20px var(--font-body)}
a{color:var(--accent)}
.top{border-bottom:1px solid var(--line)}
.top-in{max-width:none;height:56px;padding:0 16px;flex-wrap:nowrap}
.brand{gap:8px} .brand b{font:600 18px/1 var(--font-body)}
.logo{width:28px;height:28px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center}
.tagline{color:var(--muted);font-size:13px}
.sels{flex-wrap:nowrap} .sels label{font:600 12px var(--font-body);color:var(--grey);gap:8px}
.shell,.shell.gut{grid-template-columns:240px minmax(0,1fr);gap:0;max-width:none;margin:0;padding:0}
#nav{background:var(--sunk);border-right:1px solid var(--line);padding:16px 12px;gap:2px;top:57px;height:calc(100vh - 57px);overflow:auto}
#main{padding:24px 32px 96px;max-width:1320px;gap:16px}
.navh{font:700 11px/16px var(--font-body);letter-spacing:.02em;text-transform:uppercase;color:var(--muted);padding:16px 8px 6px}
.navb{align-items:center;height:36px;padding:0 8px;border-radius:3px;font-weight:500;color:var(--grey);white-space:nowrap}
.navb:hover{background:var(--neutral)} .navb .ic{margin:0;color:var(--grey)}
.navb[aria-current="page"]{background:var(--accent-soft);color:var(--accent)} .navb[aria-current="page"] .ic{color:var(--accent)}
.navfoot{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line)}
.nb{background:var(--crit);border:0;color:#fff;border-radius:8px;padding:0 6px;font:600 12px/16px var(--font-body);margin-left:auto}
@media (max-width:860px){ .shell,.shell.gut{grid-template-columns:minmax(0,1fr)} #nav{position:static;height:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}
  .navfoot{display:none} #main{padding:16px 16px 96px} .tagline{display:none} }
/* Button */
.btn{height:32px;padding:0 12px;border:0;border-radius:3px;background:var(--neutral);color:var(--ink);font-weight:500;font-size:14px;gap:6px}
.btn:hover{background:var(--neutral-h)}
.btn.pri{background:var(--accent);color:#fff} .btn.pri:hover{background:#0055cc;filter:none}
.btn.subtle{background:none} .btn.subtle:hover{background:var(--neutral)}
.btn.sm{height:24px;padding:0 8px;font-size:13px}
.btn.warn{background:var(--crit-soft);color:var(--crit);border:0}
.btn.link{height:auto;padding:0;background:none;color:var(--accent);font-weight:400;text-decoration:none} .btn.link:hover{background:none;text-decoration:underline}
.btn:disabled{background:rgba(9,30,66,.03);color:rgba(9,30,66,.31);opacity:1}
/* Textfield, Select */
.in{border:1px solid #8590a2;border-radius:3px;padding:5px 8px;background:#fff;min-height:32px}
.in:hover{background:var(--sunk)} .in:focus{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);outline:0;background:#fff}
.field>span,.flabel{font:600 12px/16px var(--font-body);color:var(--grey)}
.help{font-size:12px;color:var(--muted);max-width:80ch}
.search{position:relative;flex:0 1 280px} .search .ic{position:absolute;left:8px;top:8px;color:var(--muted)} .search .in{padding-left:30px}
/* Lozenge, Badge, Tag */
.loz{display:inline-block;font:700 11px/16px var(--font-body);text-transform:uppercase;padding:0 4px;border-radius:3px;background:#dcdfe4;color:var(--grey);white-space:nowrap;letter-spacing:0}
.loz.danger{background:#ffd5d2;color:#ae2e24} .loz.success{background:#baf3db;color:#216e4e} .loz.info{background:#cce0ff;color:#0055cc} .loz.warning{background:#f8e6a0;color:#7f5f01} .loz.new{background:#dfd8fd;color:#5e4db2}
.count,.cnt{font:400 12px/16px var(--font-body);background:var(--neutral);color:var(--ink);padding:0 6px;border-radius:8px;min-width:24px;text-align:center;display:inline-block}
.badge{font:400 12px/20px var(--font-body);padding:0 6px;border-radius:3px;background:var(--neutral);color:var(--ink)}
.badge.ap{background:var(--warn-soft);color:var(--warn)} .badge.ok{background:var(--ok-soft);color:var(--ok)}
.chip{font-size:12px;line-height:20px;padding:0 6px;border-radius:3px;border:0;background:var(--neutral);color:var(--ink)}
.chip.delivered{background:var(--ok-soft);color:var(--ok)} .chip.retrying,.chip.pending{background:var(--warn-soft);color:var(--warn)} .chip.parked{background:var(--crit-soft);color:var(--crit)}
.sev{font:700 11px/16px var(--font-body);text-transform:uppercase;border-radius:3px;padding:0 4px;gap:3px}
.sv-critical,.sv-error{color:#c9372c} .sv-warning{color:#b38600} .sv-info{color:var(--accent)} .sv-debug{color:var(--muted)}
/* Section message, cards */
.banner{border:0;background:var(--warn-soft);border-radius:3px;padding:12px 16px;font-size:14px}
.banner.info{background:var(--info-soft)} .banner.ok{background:var(--ok-soft)}
.card{border:1px solid var(--line);border-radius:8px;box-shadow:none;padding:16px 20px}
/* Page header, breadcrumbs */
.phead{display:flex;flex-direction:column;gap:8px} .pdesc{color:var(--muted);max-width:86ch}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px}
/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:6px 8px 8px;margin-bottom:-2px;border-bottom:2px solid transparent;color:var(--grey);font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab:hover{color:var(--accent)} .tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
/* Dynamic table */
.tablewrap{overflow-x:auto}
th{font:600 12px/16px var(--font-body);letter-spacing:0;text-transform:none;color:var(--muted);padding:4px 8px;border-bottom:2px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.clickable{cursor:pointer} tr.clickable:hover{background:var(--sunk)}
td.r,th.r{text-align:right}
.ikey{display:inline-flex;gap:6px;align-items:center;color:var(--accent);font-weight:500;white-space:nowrap}
.sum b{font-weight:500;display:block;overflow-wrap:anywhere} .sum small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52ch}
.plat{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
/* User */
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font:600 12px/1 var(--font-body);flex:none}
.av.sm{width:24px;height:24px;font-size:10px} .av.none{background:var(--neutral);color:var(--grey)}
.user{display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
/* Empty state */
.empty{border:0;padding:48px 16px;gap:12px} .empty h2{font-size:20px;line-height:24px} .empty p{max-width:52ch}
.empty .tile{width:56px;height:56px}
/* Tile */
.tile{width:40px;height:40px;border-radius:8px;border:0;background:var(--cs,var(--accent-soft));color:var(--c,var(--accent));font-size:inherit}
.tile.sm{width:32px;height:32px;border-radius:6px}
/* Platforms */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.pcard{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:8px;background:#fff;padding:16px;cursor:pointer;line-height:1.4}
.pcard:hover{background:var(--sunk);border-color:#b3b9c4}
.pc-main{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0} .pc-main b{font-size:15px} .pc-main small{color:var(--muted);font-size:12px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){ .split{grid-template-columns:minmax(0,1fr)} }
textarea.code{font:13px/1.45 var(--font-mono);min-height:230px}
/* Issue view */
#drawer{width:min(1080px,100%)}
#drawerHead{padding:16px 24px;gap:10px} #drawerBody{padding:20px 24px}
.issue{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
@media (max-width:900px){ .issue{grid-template-columns:minmax(0,1fr)} }
.issue-main{display:flex;flex-direction:column;gap:24px;min-width:0}
.issue-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.dbox{border:1px solid var(--line);border-radius:4px}
.dbox>h3{padding:10px 12px;border-bottom:1px solid var(--line)}
.dl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px 8px;padding:12px;align-items:center;margin:0}
.dl dt{font:500 13px/16px var(--font-body);color:var(--muted)} .dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.nlist{display:flex;flex-direction:column;gap:8px;padding:12px}
.nlist li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.act{display:flex;flex-direction:column}
.act li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;padding:8px 0;align-items:start}
.act li small{color:var(--muted);white-space:nowrap}
.kv{gap:8px 14px}
/* Modal dialog */
#modal{position:fixed;inset:0;z-index:40;display:grid;place-items:start center;padding:60px 16px 16px;background:var(--scrim);overflow:auto}
.mbox{background:#fff;border-radius:3px;width:min(640px,100%);box-shadow:var(--shadow);display:flex;flex-direction:column}
.mhead{padding:24px 24px 4px} .mbody{padding:12px 24px 20px;display:flex;flex-direction:column;gap:14px} .mfoot{padding:0 24px 24px;display:flex;justify-content:flex-end;gap:8px}
/* Progress tracker */
.ptrack{display:flex;margin:4px 0 6px} .ptrack li{flex:1;position:relative;padding-top:16px;font-size:12px;color:var(--muted);text-align:center}
.ptrack li::before{content:"";position:absolute;top:0;left:50%;width:8px;height:8px;border-radius:50%;background:#dcdfe4;transform:translateX(-50%);z-index:1}
.ptrack li::after{content:"";position:absolute;top:3px;left:-50%;width:100%;height:2px;background:#dcdfe4} .ptrack li:first-child::after{display:none}
.ptrack li.done::before,.ptrack li.cur::before{background:var(--accent)} .ptrack li.done::after,.ptrack li.cur::after{background:var(--accent)}
.ptrack li.cur{color:var(--ink);font-weight:600}
/* Toggle */
.toggle{display:flex;gap:8px;align-items:center;border:0;background:none;cursor:pointer;padding:6px 8px;font-size:13px;color:var(--grey);border-radius:3px;text-align:left}
.toggle:hover{background:var(--neutral)} .toggle .sw{width:32px;height:16px;border-radius:8px} .toggle .sw::after{width:12px;height:12px}
.toggle[aria-checked="true"] .sw{background:var(--ok)} .toggle[aria-checked="true"] .sw::after{left:18px}
.trace{background:var(--sunk);border:0;border-radius:8px}
.toast{background:#172b4d;border-radius:3px}

/* ---- shell like Atlassian's current navigation: top bar (sidebar toggle, app grid, logo, search, Create, profile),

#nav{background:#fff;padding:12px 10px;gap:2px}

.navb[aria-current="page"]{font-weight:500}

.navrow{display:flex;align-items:center;gap:2px} .navrow .navb{flex:1;min-width:0}
.navsub{display:flex;flex-direction:column;gap:2px;padding-left:18px;margin-bottom:6px}

  return {'X-Herald-User':'person:'+who,'X-Herald-Role':{responder:'responder',lead:'approver',editor:'editor'}[S.role],'X-Herald-Teams':t.personal?'':t.id};}

/* Single sign-on only. "step_up_required": this action needs a fresh sign-in, then you come back to the same alert.
   Any other 401: the session has ended, so sign in again and come back here. */
function backHere(){return location.pathname+location.search+(S.drawer&&S.drawer.kind==='alert'?'#alert-'+S.drawer.id:location.hash);}
function signInAgain(detail){if(leaving)return;const step=detail==='step_up_required';
  toast(step?'This step needs you to confirm it is you. Taking you to sign in…':'Your session has ended. Taking you to sign in…');render();
  leaving=true;if(streamCtl){const c=streamCtl;streamCtl=null;c.abort();}
  if(step){try{sessionStorage.setItem('herald.stepup','1');}catch(e){}}
  const url=step?'/auth/login?'+new URLSearchParams({provider:ME.provider||'sso',step_up:'1',next:backHere()}):'/login?'+new URLSearchParams({error:'expired',next:backHere()});
  setTimeout(()=>location.assign(url),900);}
async function api(path,o){o=o||{};const h=o.admin?{}:Object.assign({},ident());  /* admin: the demo's all-seeing view, used by the walkthrough */if(o.body!==undefined)h['Content-Type']='application/json';
  const r=await fetch(path,{method:o.method||(o.body!==undefined?'POST':'GET'),headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined});
  let data=null;try{data=await r.json();}catch(e){}
  if(r.status===401&&OIDC()){signInAgain(data&&data.detail);const err=new Error('Taking you to sign in…');err.status=401;throw err;}
  if(!r.ok){const d=data&&data.detail;
    const msg=typeof d==='string'?d:Array.isArray(d)?d.map(x=>(x.loc&&x.loc.length?x.loc.join('.')+': ':'')+String(x.msg).replace(/^Value error, /,'')).join('; '):'The service answered '+r.status;
    const err=new Error(msg);err.status=r.status;throw err;}
  return data;}
function pname(ref){ref=String(ref||'');if(!ref)return '';if(ref.indexOf('system:')===0)return 'Herald (automatic)';
  if(ref.indexOf('person:')===0){const p=PEOPLE[ref.slice(7)];return p?p.name:cap(ref.slice(7));}
  if(ref.indexOf('team:')===0){const id=ref.slice(5).replace('/on-call','');const n=TEAMS[id]?TEAMS[id].name:cap(id);return ref.endsWith('/on-call')?n+' on-call person':n+' team';}
  return ref;}

function mapWhy(n){if(n.all)return {kind:'all',ok:n.passed,children:n.all.map(mapWhy)};if(n.any)return {kind:'any',ok:n.passed,children:n.any.map(mapWhy)};
  if(n.not)return {kind:'not',ok:n.passed,children:[mapWhy(n.not)]};

function tlText(t){const who=pname(t.actor),d=t.detail||{},via=d.via?' ('+({ui:'in Herald',sms:'by SMS reply'}[d.via]||d.via)+')':'';
  switch(t.action){
    case 'ack':return 'Acknowledged by '+who+via;
    case 'resolve':return 'Resolved by '+who+via+(d.rule?': the source reported that the problem has cleared':'');
    case 'incident_manager':return who+' took this alert';
    case 'assigned':return d.to?who+' handed this alert to '+pname(d.to):who+' removed the assignee';
    case 'step_done':return 'Step '+d.step+' marked done by '+who;
    case 'action_run':return 'Step '+d.step+(d.action&&d.action!=='manual'?' ('+d.action+')':'')+((d.result&&d.result.ok)?' done':' failed')+', by '+who;
    case 'approval_requested':return who+' asked to run step '+d.step+'. Waiting for approval';
    case 'approved':return 'Step '+d.step+' approved by '+who+via;
    case 'rejected':return 'Step '+d.step+' rejected by '+who+via;

    default:return who+': '+String(t.action).replace(/_/g,' ');}}

/* Live push: server-sent events read with fetch, so the identity headers can be sent. Reconnects and resumes. */
let streamCtl=null;
async function connect(){if(streamCtl)streamCtl.abort();const ctl=streamCtl=new AbortController();let last=null;
  while(streamCtl===ctl){
    try{const h=Object.assign({},ident());if(last)h['Last-Event-ID']=last;
      const r=await fetch('/api/stream?owner='+encodeURIComponent(T().owner),{headers:h,signal:ctl.signal});
      if(r.status===401&&OIDC()){let d=null;try{d=(await r.json()).detail;}catch(e){}signInAgain(d);return;}
      if(!r.ok||!r.body)throw new Error('stream refused');
      S.live=true;paintLive();const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
      for(;;){const x=await rd.read();if(x.done)break;buf+=dec.decode(x.value,{stream:true});let i;
        while((i=buf.indexOf('\n\n'))>=0){const frame=buf.slice(0,i);buf=buf.slice(i+2);const m=/^id: (\d+)$/m.exec(frame);if(m){last=m[1];onFeed();}}}
    }catch(e){if(streamCtl!==ctl)return;}
    S.live=false;paintLive();if(streamCtl===ctl)await sleep(1500);}}
function paintLive(){const n=$('liveDot');if(n)n.innerHTML=liveHtml();}
const liveHtml=()=>S.live?'':'<span class="dot"></span>Reconnecting…';
let feedTimer=null;
function onFeed(){if(feedTimer)return;feedTimer=setTimeout(async()=>{feedTimer=null;
  try{await Promise.all([loadAlerts(),loadEvents(),loadDetail(),loadPlatforms(),loadView()]);}catch(e){}render();},150);}

const isGroup=n=>!!(n&&(n.all||n.any||n.not));
const risky=a=>!!(S.meta&&(S.meta.actions.find(x=>x.name===a)||{}).risk==='high');
const needsApproval=st=>!!((st.approval&&st.approval!=='none')||risky(st.action));

/* ============ plain language ============ */
const tname=to=>{const id=String(to).slice(5).replace('/on-call','');return TEAMS[id]?TEAMS[id].name:cap(id);};
function rcptPhrase(to){to=String(to);if(to.endsWith('/on-call'))return 'the '+tname(to)+' on-call person';if(to.indexOf('team:')===0)return 'the '+tname(to)+' team';return pname(to);}
function flabel(f){f=String(f||'');if(f.charAt(0)==='@')return {'@severity':'severity','@service':'service','@type':'event type','@source':'source','@timestamp':'time'}[f]||f.slice(1);
  let s=f.split('.');while(s.length>1&&['payload','data','labels','meta','annotations'].includes(s[0]))s.shift();
  return s.join(' ').replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').toLowerCase()||'(no field)';}
function vfmt(v){const one=x=>x&&typeof x==='object'?JSON.stringify(x):String(x);if(Array.isArray(v))return joinAnd(v.map(one),'or');if(v&&typeof v==='object')return JSON.stringify(v);if(typeof v==='number')return nf(v);return String(v==null?'':v);}
function leafPhrase(n){const l=flabel(n.field);switch(n.op){
  case 'exists':return l+' has a value';
  case 'severity_gte':return l+' is '+(sevName(n.value)||vfmt(n.value))+' or worse';
  case 'glob':return l+' matches '+vfmt(n.value);
  case 'regex':return l+' matches the pattern '+vfmt(n.value);
  default:return l+' '+(OPL[n.op]||n.op)+' '+vfmt(n.value);}}
function condPhrase(n,top){
  if(n.all||n.any){const k=n.all||n.any;if(!k.length)return '';const s=joinAnd(k.map(x=>condPhrase(x,false)).filter(Boolean),n.all?'and':'or');return top||k.length<2?s:'('+s+')';}
  if(n.not){const k=n.not.any||[n.not];return 'none of these is true: '+k.map(x=>condPhrase(x,false)).join('; ');}
  return leafPhrase(n);}
function notifyPhrase(n){const who=rcptPhrase(n.to),v={phone:'call',sms:'text',email:'email'};
  const part=ch=>{const a=ch.filter(c=>c!=='ui').map(c=>v[c]);let s=a.length?joinAnd(a)+' '+who:'';if(ch.includes('ui'))s+=(s?' and ':'')+'show it to '+who+' in Herald';return s;};
  let s=part(n.channels||[]);if(!s)return '';
  if(n.hours)s+=' between '+n.hours.from+' and '+n.hours.to+((n.else&&n.else.length)?' (outside those hours, '+part(n.else)+')':' (outside those hours, do nothing)');return s;}
function ruleSentence(r){const c=condPhrase(r.when,true);const acts=(r.notify||[]).map(notifyPhrase).filter(Boolean);
  let s=(c?'When '+c:'For every event that arrives')+', '+(acts.length?joinAnd(acts):'tell nobody yet')+'.';
  if(r.group&&r.group.by&&r.group.by.length)s+=' Repeats with the same '+joinAnd(r.group.by.map(flabel))+' are counted on one alert'+(r.group.window?', with a reminder at most every '+r.group.window:'')+'.';return s;}
function needText(n){switch(n.op){case 'eq':return 'needs to be '+vfmt(n.value);case 'ne':return 'must not be '+vfmt(n.value);case 'gt':return 'needs to be over '+vfmt(n.value);
  case 'gte':return 'needs at least '+vfmt(n.value);case 'lt':return 'needs to be under '+vfmt(n.value);case 'lte':return 'needs at most '+vfmt(n.value);
  case 'in':return 'needs to be one of '+vfmt(n.value);case 'contains':return 'needs to contain '+vfmt(n.value);case 'glob':case 'regex':return 'needs to match '+vfmt(n.value);
  case 'exists':return 'needs a value';case 'severity_gte':return 'needs '+(sevName(n.value)||n.value)+' or worse';}return '';}
function firstFail(tr){if(tr.ok)return null;
  if(tr.kind==='leaf')return flabel(tr.node.field)+' is '+(tr.actual===undefined?'missing':vfmt(tr.actual))+', '+needText(tr.node);
  if(tr.kind==='not')return 'an excluded condition is true';
  if(tr.kind==='any')return tr.children.length?'none of the alternatives matched (first: '+firstFail(tr.children[0])+')':'no conditions in the group';
  for(const c of tr.children){const f=firstFail(c);if(f)return f;}return 'did not match';}
function evLabel(ev){const t=ev.attrs.type||'(no type found)';const s=ev.attrs.service;return t+(s?' · '+s:'');}
function failText(leaves){const n=leaves&&leaves[0];if(!n)return 'did not match';if(n.not)return 'an excluded condition is true';
  return flabel(n.field)+' is '+(n.missing||n.actual==null?'missing':vfmt(n.actual))+', '+needText(n);}

function toast(text,btn){if(leaving)return;/* on the way to sign-in: no follow-up errors */const id=++seq;S.toasts.push({id:id,text:text,btn:btn});if(S.toasts.length>3)S.toasts.shift();
  setTimeout(()=>{S.toasts=S.toasts.filter(x=>x.id!==id);renderToasts();},8000);}

/* ============ rule drafts ============ */
function blankRule(){const o=T().owner;return {id:null,owner:o,name:'',enabled:true,version:0,when:{all:[]},severity:'warning',
  present:{title:'',body:'',fields:[],highlight:[],colour:'amber'},group:{by:[],window:'5m'},
  notify:[{to:T().personal?o:'team:'+S.team,channels:['ui']}],runbook:null};}
function normDraft(r){const fix=n=>{if(n.not){if(!n.not.any)n.not={any:[n.not]};n.not.any.forEach(fix);}else if(n.all)n.all.forEach(fix);else if(n.any)n.any.forEach(fix);};
  if(!isGroup(r.when))r.when={all:[r.when]};fix(r.when);r.present=r.present||{};r.present.fields=r.present.fields||[];r.present.highlight=r.present.highlight||[];
  r.group=r.group||{by:[],window:'5m'};r.notify=r.notify||[];return r;}
const kids=n=>n.all||n.any||n.not.any;
function nodeAt(path){let n=S.draft.when;if(path==='')return n;for(const i of String(path).split('.'))n=kids(n)[+i];return n;}
function parentOf(path){const p=String(path).split('.');const idx=+p.pop();return {parent:nodeAt(p.join('.')),idx:idx};}
function startEdit(draft,isNew,sampleId){S.draft=normDraft(draft);S.draftNew=isNew;S.edTest=null;S.edPrev=null;S.edErr=null;
  const hit=draft.id&&S.events.find(e=>e.fired.includes(draft.id));  /* start on an event this rule fired on, if there is one */
  S.edSample=sampleId||(hit?hit.id:(S.events[0]?S.events[0].id:null));S.view='rules';S.drawer=null;S.detail=null;}
function leaves(n,out){out=out||[];if(isGroup(n))kids(n).forEach(k=>leaves(k,out));else out.push(n);return out;}
function draftProblem(d){if(!kids(d.when).length)return 'Add at least one condition. Click a field in the sample event to start.';
  if(leaves(d.when).some(l=>!String(l.field||'').trim()))return 'Choose a field for every condition.';
  const empty=n=>isGroup(n)&&(!kids(n).length||kids(n).some(empty));if(empty(d.when))return 'A group has no conditions. Add one or remove the group.';return null;}
function rulePayload(d){return {id:d.id||undefined,owner:d.owner,name:(d.name||'').trim()||'Untitled rule',enabled:d.enabled!==false,when:d.when,
  severity:d.severity==='event'?null:d.severity,
  present:{title:d.present.title||'{{@type}}',body:d.present.body||'',fields:d.present.fields||[],highlight:d.present.highlight||[],colour:d.present.colour||null},
  group:{by:(d.group.by&&d.group.by.length)?d.group.by:['@type','@service'],window:d.group.window||null},
  notify:(d.notify||[]).map(n=>{const o={to:n.to,channels:n.channels||[]};if(n.hours){o.hours=n.hours;o.else=n.else||[];}return o;}),
  runbook:d.runbook||null,resolve_when:d.resolve_when||null};}
function suggestRule(ev){const t=T(),flat=flatten(ev.raw),type=ev.attrs.type,when={all:[]};
  if(type!=null)when.all.push({field:'@type',op:'eq',value:type});
  else{const p=Object.keys(flat).find(k=>typeof flat[k]==='string');if(p)when.all.push({field:p,op:'eq',value:flat[p]});}
  when.all.push({field:'@source',op:'eq',value:ev.source});
  return {id:null,owner:t.owner,name:'New: '+(type||ev.source),enabled:true,when:when,severity:ev.attrs.severity?'event':'warning',
    present:{title:type!=null?'{{@type}}':'Event from {{@source}}',body:'Received from {{@source}}',fields:Object.keys(flat).slice(0,6),highlight:[],colour:'amber'},
    group:{by:['@type','@service'],window:null},notify:[{to:t.personal?t.owner:'team:'+t.id,channels:['ui']}],runbook:null};}
/* Ask the service how the draft behaves: which recent events match, and how the alert would look. */
let chkTimer=null,chkGen=0;
function checkDraft(){if(!S.draft)return;clearTimeout(chkTimer);chkTimer=setTimeout(async()=>{const my=++chkGen,d=S.draft;if(!d)return;
  const sample=S.events.find(e=>e.id===S.edSample)||S.events[0];let test=null,prev=null,err=draftProblem(d);
  if(!err){try{test=await api('/api/rules/test',{body:{when:d.when}});}catch(e){err=e.message;}}
  if(!err&&sample){try{prev=await api('/api/rules/preview',{body:{rule:rulePayload(d),event:sample.raw,source:sample.source}});}catch(e){err=e.message;}}
  if(my!==chkGen||!S.draft)return;S.edTest=test;S.edPrev=prev;S.edErr=err;const s=$('edSide');if(s)s.innerHTML=editorSide();},250);}

/* ---- following one event through Herald ---- */
function traceBox(tr){if(!tr)return '';const mark=o=>o===true?`<span class="t-ok">${ic('checkmark_circle_f')}</span>`:o===false?`<span class="t-no">${ic('dismiss_circle_f')}</span>`:`<span class="t-wait">${ic('clock')}</span>`;
  const other=tr.alert&&tr.alert.owner!==T().owner;
  const ssoOpen=()=>{const k=teamKey(tr.alert.owner),mine=canSwitchTo(k)&&TEAMS[k].owner===tr.alert.owner;
    return !other?'<button class="btn pri" data-act="traceOpen">Open the alert</button>':mine?`<button class="btn pri" data-act="traceOpen">Open the alert</button><span class="help">It belongs to ${esc(pname(tr.alert.owner))}, so the screen switches to that team.</span>`
      :`<span class="help">It belongs to ${esc(pname(tr.alert.owner))}. Only members of that team can open it.</span>`;};
  return `<div class="trace" aria-live="polite"><div class="row"><b class="grow">${esc(tr.label)}</b>${tr.done?'':'<span class="live"><span class="dot pulse"></span>Following it…</span>'}</div>
    <ol>${tr.steps.map(x=>`<li>${mark(x.ok)}<span>${esc(x.text)}${x.sub?`<small>${esc(x.sub)}</small>`:''}</span></li>`).join('')}</ol>
    ${tr.alert?`<div class="row">${OIDC()?ssoOpen():`<button class="btn pri" data-act="traceOpen">Open the alert${other?' as '+esc(TEAMS[teamKey(tr.alert.owner)].oncall):''}</button>${other?`<span class="help">It belongs to ${esc(pname(tr.alert.owner))}, so the screen switches to them.</span>`:''}`}</div>`:''}</div>`;}
/* x = {label, src, event, count}. Sends through the platform's real route, asks the service what it decided, then watches what changed. */
async function runTrace(x){const ev=x.event;
  const tr=S.trace={label:x.label,steps:[{ok:null,text:'Sending it through '+platName(x.src)+'…'}],done:false,alert:null};render();
  const adminAlerts=()=>api('/api/alerts?limit=200',{admin:true});
  try{const before=await adminAlerts();
    const sent=await api('/api/sim/send',{admin:true,body:{source:x.src,event:ev,count:x.count||1}});
    tr.steps[0]={ok:true,text:(sent.sent>1?nf(sent.sent)+' events':'The event')+' reached Herald from '+platName(x.src)};
    const ex=await api('/api/events/explain',{admin:true,body:{event:ev,source:x.src}});
    const live=[].concat(...ex.items.map(it=>it.rules.filter(r=>r.enabled))),fired=live.filter(r=>r.passed&&!r.closes),closed=live.filter(r=>r.closes);
    if(fired.length)tr.steps.push({ok:true,text:'A rule matched: “'+[...new Set(fired.map(r=>r.name))].join('”, “')+'”',sub:'It belongs to '+pname(fired[0].owner)});
    else if(closed.length)tr.steps.push({ok:true,text:'The event says the problem is over',sub:'Rule: “'+closed[0].name+'”'});
    else{const near=live.slice().sort((p,q)=>p.failed_because.length-q.failed_because.length)[0];
      tr.steps.push({ok:true,text:'No rule matched, so no alert was raised',sub:near?'Closest rule: “'+near.name+'”. '+cap(failText(near.failed_because))+'.':'No team has a rule for this yet. Open the event under “Events” to build one.'});tr.done=true;await Promise.all([loadEvents(),loadPlatforms()]).catch(()=>{});render();return;}
    render();const ids=fired.concat(closed).map(r=>r.id);let hit=null;
    for(let i=0;i<16&&!hit;i++){await sleep(400);const now=await adminAlerts();
      for(const a of now){if(!ids.includes(a.rule_id))continue;const b=before.find(q=>q.id===a.id);
        if(!b){hit={a:a,isNew:true};break;}if(b.count!==a.count||b.status!==a.status){hit={a:a,isNew:false};break;}}}
    if(!hit)tr.steps.push({ok:closed.length?true:false,text:closed.length?'There was no open alert to close':'No alert changed within a few seconds'});
    else{let a=hit.a;
      if(a.status==='resolved'&&!fired.length)tr.steps.push({ok:true,text:'The open alert was resolved automatically',sub:a.key+' · '+a.title});
      else if(hit.isNew){await sleep(1200);a=(await adminAlerts()).find(q=>q.id===a.id)||a;
        tr.steps.push({ok:true,text:'A new alert was created: '+a.key,sub:a.title+(a.count>1?' · all '+nf(a.count)+' events are counted on this one alert':'')});
        const told=(a.deliveries||[]).map(d=>pname(d.recipient)+' by '+({phone:'phone call',sms:'text message',email:'email',ui:'the Herald screen'}[d.channel]||d.channel)+(d.status==='sent'?'':' ('+d.status+')'));
        tr.steps.push({ok:true,text:told.length?'Notified: '+joinAnd(told):'Nobody is set to be notified'});}
      else tr.steps.push({ok:true,text:'It was added to '+a.key+', which is already open (seen '+nf(a.count)+' times)',sub:'Nobody was notified again: one problem, one alert.'});
      tr.alert={id:String(a.id),owner:a.owner};}
  }catch(e){tr.steps.push({ok:false,text:e.message});}
  tr.done=true;await loadEvents().catch(()=>{});await refresh();}

function defaultEvent(id){const last=S.events.find(e=>e.source===id);if(last)return JSON.stringify(last.raw,null,2);

function viewPlatform(x){const tab=S.ptab,mine=S.alerts.filter(a=>a.source===x.id),open=mine.filter(a=>a.status!=='resolved'),done=mine.filter(a=>a.status==='resolved'),evs=S.events.filter(e=>e.source===x.id);

  else if(tab==='send')body=`<div class="split"><section class="card">

  else if(tab==='setup')body=`<div class="split"><section class="card"><h2>Connection</h2>
        <dl class="kv"><dt>Type</dt><dd>${PTYPE[x.type]||esc(x.type)}</dd><dt>Identifier</dt><dd><code>${esc(x.id)}</code></dd>

    ctl=`<div class="banner"><div>${ic('shield_checkmark','sm')} Waiting for ${ap.approver?'<b>'+esc(pname(ap.approver))+'</b>':'a second person'} to approve · asked by ${esc(pname(ap.requested_by))}</div>

  else if(a.status!=='resolved'&&(state==='todo'||state==='failed')){const lab=need?'Ask for approval to run':!st.action?'Mark as done':st.kind==='wait'?'Start the timer':state==='failed'?'Try again':'Run this step';

  return `<li class="step"><div class="sn ${state}" aria-hidden="true">${state==='done'?'✓':state==='failed'?'!':i+1}</div>
    <div class="sb"><div class="row"><b style="overflow-wrap:anywhere">${esc(st.text)}</b></div>
      <div class="row"><span class="badge ${state==='done'?'ok':''}">${stateLab}</span><span class="badge">${{check:'Check',action:'Herald can do this',manual:'Done by a person',wait:'Wait'}[st.kind]||'Step'}</span>${need?`<span class="badge ap">${ic('shield_checkmark','sm')} Needs approval</span>`:''}${st.suggest&&!st.action?`<span class="badge tech-only">could be automated: ${esc(st.suggest)}</span>`:''}</div>

      ${out}${ctl}</div></li>`;}

    <datalist id="fieldList">${['@type','@severity','@service','@source','@timestamp'].concat(Object.keys(S.fields).sort()).map(f=>`<option value="${esc(f)}"></option>`).join('')}</datalist>
    <div class="ed-grid"><div class="ed-form">
      <section class="card wcard"><div class="wkey"><b>1</b>Name it<small>and say where the events come from</small></div><div class="stack">
        <div class="two"><label class="field"><span>Rule name</span><input class="in" id="dName" data-oni="dName" value="${esc(d.name)}" placeholder="e.g. Large rejected trades"></label>
          <label class="field"><span>Owned by</span><select class="in" id="dOwner" data-onc="dOwner" style="width:100%">${opt(T().owner,T().name,d.owner)}</select></label></div>
        <label class="field"><span>An event arrives from</span><select class="in" id="dSource" data-onc="dSource" style="width:100%">${opt('','any source',src)}${sources.map(s=>opt(s,s,src)).join('')}</select></label></div></section>
      <section class="card wcard"><div class="wkey"><b>2</b>Which events?<small>click a value in the example on the right to add a condition</small></div><div class="stack">${groupHtml(d.when,'')}</div></section>
      <section class="card wcard"><div class="wkey"><b>3</b>Who is told, and how?</div><div class="stack">
        ${d.notify.map((n,i)=>`<div class="ntf"><div class="row"><label class="field grow"><span>Tell</span><select class="in" id="nt-to-${i}" data-onc="ntTo" data-i="${i}" style="width:100%">${rcptOptions(n.to)}</select></label><button class="btn sm" data-act="delNt" data-i="${i}">Remove</button></div>
          <fieldset><div class="row"><span class="note">by</span>${chBoxes(i,'ch',n.channels||[])}</div></fieldset>
          <label class="chk"><input type="checkbox" id="nt-h-${i}" data-onc="ntHours" data-i="${i}" ${n.hours?'checked':''}> Only during certain hours</label>
          ${n.hours?`<div class="row"><label class="row" style="gap:6px">from <input class="in" type="time" id="nt-hf-${i}" data-onc="ntHf" data-i="${i}" value="${esc(n.hours.from)}" style="width:auto"></label><label class="row" style="gap:6px">to <input class="in" type="time" id="nt-ht-${i}" data-onc="ntHt" data-i="${i}" value="${esc(n.hours.to)}" style="width:auto"></label><span class="note">${esc(n.hours.tz)}</span></div>
            <fieldset><div class="row"><span class="note">outside those hours, use</span>${chBoxes(i,'el',n.else||[])}</div></fieldset>`:''}</div>`).join('')}
        <div><button class="btn sm" data-act="addNt">Add someone else</button></div>
        <div class="two"><label class="field"><span>Count repeats on one alert when these fields are the same</span><input class="in mono" id="dGrpBy" data-oni="dGrpBy" list="fieldList" value="${esc(d.group.by.join(', '))}" placeholder="e.g. workflowId"></label>
          <label class="field"><span>While it keeps happening, remind at most every</span><select class="in" id="dWindow" data-onc="dWindow" style="width:100%">${opt('','Never: only count repeats',d.group.window||'')}${['1m','5m','15m','1h'].map(w=>opt(w,{'1m':'1 minute','5m':'5 minutes','15m':'15 minutes','1h':'1 hour'}[w],d.group.window)).join('')}</select></label></div>
        <label class="field"><span>Show this runbook on the alert</span><select class="in" id="dRunbook" data-onc="dRunbook" style="width:100%">${opt('','No runbook',d.runbook||'')}${Object.keys(S.runbooks).map(k=>opt(k,S.runbooks[k].title,d.runbook||'')).join('')}</select></label></div></section>
      <section class="card wcard"><div class="wkey"><b>4</b>What does the alert say?<small>{{field}} inserts a value from the event</small></div><div class="stack">
        <label class="field"><span>Title. Use {{field}} to insert a value from the event</span><input class="in" id="dTitle" data-oni="dTitle" value="${esc(d.present.title)}" placeholder="e.g. Rejected {{payload.currency}} {{payload.notional}}"></label>
        <label class="field"><span>Text under the title</span><textarea class="in" id="dBody" data-oni="dBody" rows="2">${esc(d.present.body)}</textarea></label>
        <div class="two"><label class="field"><span>Severity</span><select class="in" id="dSev" data-onc="dSev" style="width:100%">${opt('critical','Critical',d.severity)}${opt('error','Error',d.severity)}${opt('warning','Warning',d.severity)}${opt('info','Info',d.severity)}${opt('event','Take it from the event',d.severity)}</select></label>
          <label class="field"><span>Colour in the feed</span><select class="in" id="dColour" data-onc="dColour" style="width:100%">${['red','orange','amber','blue','green','grey'].map(c=>opt(c,cap(c),d.present.colour)).join('')}</select></label></div>
        <div class="two"><label class="field"><span>Fields to show</span><input class="in mono" id="dFields" data-oni="dFields" value="${esc(d.present.fields.join(', '))}" placeholder="e.g. step, error.message"></label>
          <label class="field"><span>Of those, highlight</span><input class="in mono" id="dHi" data-oni="dHi" value="${esc(d.present.highlight.join(', '))}" placeholder="e.g. error.message"></label></div></div></section>
    </div><div class="ed-side" id="edSide">${editorSide()}</div></div>`;}
function jsonPick(o,pre,ind){const sp='  '.repeat(ind+1);return '{\n'+Object.keys(o).map(k=>{const p=pre?pre+'.'+k:k,v=o[k];
    if(v&&typeof v==='object'&&!Array.isArray(v))return sp+'"'+esc(k)+'": '+jsonPick(v,p,ind+1);
    return sp+`<button class="jf" data-act="pickField" data-path="${esc(p)}" title="Add a condition on ${esc(p)}">"${esc(k)}": ${esc(JSON.stringify(v))}</button>`;}).join(',\n')+'\n'+'  '.repeat(ind)+'}';}
function editorSide(){const d=S.draft,evs=S.events,t=S.edTest,p=S.edPrev;const sample=evs.find(e=>e.id===S.edSample)||evs[0];
  let prev='<p class="muted">Send an event from a platform (Platforms, then “Send event”) to see previews.</p>';
  if(S.edErr)prev=`<div class="banner">${esc(S.edErr)}</div>`;
  else if(p){const sev=p.severity,col=p.colour||SEVS[sev].col;
    prev=`${p.matches?'':'<div class="banner info">The sample event does not match this rule, so this is only how it would look.</div>'}
      <div class="prev"><span class="lab">In the Herald feed</span><div class="row top-al c-${esc(col)}"><div class="tile" aria-hidden="true">${SEVS[sev].g}</div><div class="stack grow" style="gap:4px"><div>${sevTag(sev)}</div><b style="overflow-wrap:anywhere">${esc(p.title)}</b>${p.body?`<span class="muted" style="overflow-wrap:anywhere">${esc(p.body)}</span>`:''}</div></div></div>
      <div class="prev"><span class="lab">Who would be told right now</span><p>${p.notify.length?esc(p.notify.map(n=>pname(n.recipient)+' by '+(CH[n.channel]||n.channel)).join('; ')):'<span class="muted">Nobody. Add someone under “Then”.</span>'}</p></div>
      <div class="prev"><span class="lab">Email</span><pre class="wrap">${esc(p.email)}</pre></div>
      <div class="prev"><div class="row"><span class="lab grow">SMS</span><span class="note num">${p.sms.length} of 160 characters</span></div><div class="smsb">${esc(p.sms)}</div></div>
      <div class="prev"><span class="lab">Phone call, read aloud</span><p style="overflow-wrap:anywhere">“${esc(p.voice)}”</p></div>`;}
  else if(sample)prev='<p class="muted">Asking the service…</p>';
  const res=t?t.results:[];
  return `<section class="card"><span class="lab">In plain words</span><p class="sentence">${esc(ruleSentence(d))}</p></section>
    <section class="card"><div class="row"><h2 class="grow">Sample event</h2><select class="in" id="edSample" data-onc="edSample" aria-label="Choose a sample event" style="max-width:100%">${evs.map(e=>opt(e.id,clock(e.at)+' · '+evLabel(e),sample&&sample.id)).join('')}</select></div>
      <p class="note">Click any field to add it as a condition.</p>${sample?`<pre>${jsonPick(sample.raw,'',0)}</pre>`:'<p class="muted">No events received yet. Send one from a platform: Platforms, then “Send event”.</p>'}</section>
    <section class="card"><h2>${t?'Matches '+t.matched+' of the last '+t.total+' events':'Matches'}</h2>${t?`<p class="note">Checked by the service against a sample of recent events.</p>`:''}
      <ul class="match" style="max-height:230px;overflow-y:auto">${res.slice(0,14).map(x=>`<li><span class="tick ${x.passed?'y':'n'}">${x.passed?'✓':'✗'}</span><span style="overflow-wrap:anywhere"><b>${esc(evLabel(x))}</b> <span class="muted num">${x.received_at?clock(Date.parse(x.received_at)):''}</span>${x.passed?'':`<br><span class="muted">${esc(failText(x.failed_because))}</span>`}</span></li>`).join('')}</ul></section>
    <section class="card"><h2>How it will look</h2>${prev}</section>`;}

/* ---- runbooks ---- */
function rbStepsHtml(steps){return `<ol>${steps.map((s,i)=>`<li class="rstep"><span class="note num">${i+1}.</span><div class="stack" style="gap:4px"><span style="overflow-wrap:anywhere">${varHi(s.text)}</span>
    <div class="row" style="gap:5px"><span class="badge">${{check:'Check',action:'Action',manual:'By hand',wait:'Wait'}[s.kind]}</span>${s.action&&s.kind!=='wait'?`<span class="badge mono">${esc(s.action)}</span>`:''}${approvalBadge(s)}${s.suggest&&!s.action?`<span class="badge">could be automated: ${esc(s.suggest)}</span>`:''}</div>
    ${s.condition?`<span class="note">Only if: ${esc(s.condition)}</span>`:''}${Object.keys(s.params||{}).length?`<span class="note mono" style="overflow-wrap:anywhere">${varHi(Object.keys(s.params).map(k=>k+': '+s.params[k]).join(', '))}</span>`:''}</div></li>`).join('')}</ol>`;}
function viewRunbooks(){
  return `<div><h1>Runbooks</h1><p class="muted">Paste instructions in whatever shape the team already has. Herald keeps the original and turns it into steps that can be ticked off, run, or sent for approval.</p></div>
    ${Object.keys(S.runbooks).map(k=>{const rb=S.runbooks[k];const used=rb.usedBy||[];
      return `<section class="card"><div class="row"><h2 class="grow">${esc(rb.title)}</h2><span class="badge">${esc(rb.format)}</span>
          ${rb.parsedBy==='ai'?(rb.reviewedBy?`<span class="badge ok">AI draft, reviewed by ${esc(rb.reviewedBy)}</span>`:'<span class="badge ai">AI draft, needs review</span>'):'<span class="badge ok">Read by parser</span>'}</div>
        <p class="note">Used by: ${used.length?esc(used.join(', ')):'no rule yet'}${rb.reviewedBy&&rb.parsedBy!=='ai'?' · reviewed by '+esc(rb.reviewedBy):''}</p>
        <div class="rb-grid"><div class="stack"><span class="lab">As the team wrote it</span><pre class="wrap">${esc(rb.source)}</pre></div>
          <div class="stack"><span class="lab">As steps</span>${rb.steps.length?rbStepsHtml(rb.steps):'<p class="muted">Shown on the alert as written'+(rb.link?', as a link':'')+'.</p>'}
            ${rb.parsedBy==='ai'&&!rb.reviewedBy?`<div class="row"><button class="btn sm pri" data-act="reviewRb" data-id="${k}" ${canEdit()?'':'disabled'}>Mark as reviewed</button>${canEdit()?'':'<span class="note">Needs a Rule editor or Team lead.</span>'}</div>`:''}</div></div></section>`;}).join('')}
    <section class="card"><h2>Paste any runbook</h2><p class="note">Numbered lines, bullets, a checklist or plain sentences. This splitter uses fixed rules only, no AI.</p>
      <textarea class="in" id="pasteText" data-oni="pasteText" rows="5" placeholder="1. Check the queue depth.&#10;2. If it is over 10,000: restart the consumer (needs approval).&#10;3. Wait 5 minutes and check again.">${esc(S.pasteText)}</textarea>
      <div class="row"><button class="btn pri" data-act="parsePaste">Split into steps</button><button class="btn link" data-act="pasteExample">Use an example</button></div>
      ${S.pasteSteps?(S.pasteSteps.length?`<div class="stack"><div class="row"><span class="lab grow">As steps</span><span class="badge ok">Read by the service’s parser</span></div>${rbStepsHtml(S.pasteSteps)}<div class="row" style="flex-wrap:nowrap"><input class="in" id="pasteId" data-oni="pasteId" value="${esc(S.pasteId)}" placeholder="Name it, e.g. Ledger lag" aria-label="Runbook name"><button class="btn pri" data-act="saveRunbook" ${canEdit()?'':'disabled'}>Save runbook</button></div>${canEdit()?'':'<span class="note">Saving needs a Rule editor or Team lead.</span>'}</div>`:'<div class="banner">No steps found. Type or paste some instructions first.</div>'):''}</section>`;}

/* ---- deliveries ---- */
function threads(){const by={};S.phone.messages.slice().reverse().forEach(m=>{if(m.person)(by[m.person]=by[m.person]||[]).push(m);});return by;}
function viewDeliveries(){const t=T(),th=threads();const people=[...new Set([t.oncallId,t.leadId].concat(Object.keys(th)).filter(Boolean))];
  if(!people.includes(S.phoneWho))S.phoneWho=people[0];const who=S.phoneWho,msgs=th[who]||[];
  const waiting=S.deliveries.filter(n=>n.status!=='sent'&&n.status!=='dead').length;
  const codes=[...new Set((msgs.filter(m=>m.kind==='sms').slice(-3).map(m=>m.text).join(' ').match(/\b(?:ACK|YES)\s\d{1,8}\b/g)||[]))].slice(-2);
  const st=n=>n.status==='sent'?(n.channel==='ui'?'shown':'delivered'):n.status==='retrying'?'retrying, attempt '+n.attempts:n.status==='dead'?'failed, sent another way':'sending';
  const cls=n=>n.status==='sent'?'delivered':n.status==='retrying'?'retrying':n.status==='dead'?'parked':'pending';
  return `<div><h1>Sent messages</h1><p class="muted">Every call, text and email Herald sent for this team. In this demo the phone and the mailbox below stand in for real ones; a reply typed on the phone acts on the real alert.</p></div>
    ${S.phone.down?`<div class="banner"><b>The SMS and phone gateway is down.</b> ${waiting} message${waiting===1?' is':'s are'} waiting and will be sent when it returns. Nothing is dropped. <button class="btn link" data-act="smsToggle">Bring it back</button></div>`:''}
    <div class="dl-grid"><section class="stack"><h2>Phone</h2>
        <div class="ptabs" role="group" aria-label="Whose phone">${people.map(p=>`<button class="ptab" data-act="phoneTab" data-who="${esc(p)}" aria-pressed="${p===who}">${esc(pname('person:'+p))}</button>`).join('')}</div>
        <div class="phone"><div class="row"><b class="grow">${esc(pname('person:'+who))}</b><span class="note">Texts and calls from Herald</span></div>
          <div class="thread" id="thread">${msgs.map(m=>m.kind==='reply'?`<div class="bub out">${esc(m.text)}<small class="num">${clock(m.at*1000)}</small></div>`
              :`<div class="bub in">${m.kind==='call'?'<i>Phone call, read aloud:</i> ':''}${esc(m.text)}<small class="num">${clock(m.at*1000)}</small></div>`).join('')||'<p class="muted" style="text-align:center;margin:auto">No messages yet.</p>'}</div>
          ${codes.length?`<div class="row" style="gap:5px"><span class="note">Quick reply:</span>${codes.map(c=>`<button class="btn sm" data-act="smsQuick" data-t="${c}">${c}</button>`).join('')}</div>`:''}
          <div class="row" style="flex-wrap:nowrap"><input class="in" id="smsReply" data-oni="smsDraft" value="${esc(S.smsDraft)}" placeholder="Reply, e.g. ACK 17 or YES 4821" aria-label="Reply by SMS"><button class="btn pri" data-act="smsSend">Send</button></div></div>
        <div class="row"><button class="btn sm" data-act="smsToggle">${S.phone.down?'Bring the gateway back':'Take the gateway down'}</button>${S.phone.page?`<a class="note" href="${esc(S.phone.page)}" target="_blank" rel="noopener">Open the gateway’s own page</a>`:''}</div></section>
      <section class="stack"><h2>Mailbox</h2><div class="card" style="padding:0;gap:0">
        ${S.mail.messages.length?`<div class="mail">${S.mail.messages.slice(0,8).map(m=>`<div class="mrow"><b style="overflow-wrap:anywhere">${esc(m.subject)}</b><span class="note num">${m.at?clock(Date.parse(m.at)):''}</span><span class="note">To ${esc((m.to||[]).join(', '))}</span></div>`).join('')}</div>`
          :`<p class="muted" style="padding:16px">${S.mail.unavailable?'The mock mail server did not answer.':'No email sent yet. The Rates rule sends one for large rejected trades.'}</p>`}</div>
        ${S.mail.page?`<a class="note" href="${esc(S.mail.page)}" target="_blank" rel="noopener">Open the full mailbox to read the emails</a>`:''}</section></div>
    <section class="card"><div class="row"><h2 class="grow">Delivery log</h2><span class="note">Latency is measured from the event arriving to the channel accepting the message.</span></div>
      <div class="scroll-x"><table><thead><tr><th>Time</th><th>Alert</th><th>To</th><th>Channel</th><th>Attempts</th><th>Status</th><th>Latency</th></tr></thead><tbody>
        ${S.deliveries.map(n=>`<tr><td class="num">${clock(Date.parse(n.created_at))}</td><td style="min-width:180px">${esc(n.title)}</td><td>${esc(pname(n.recipient))}</td><td>${CH[n.channel]||esc(n.channel)}${n.last_error&&n.status!=='sent'?`<div class="note" style="overflow-wrap:anywhere">${esc(String(n.last_error).slice(0,90))}</div>`:''}</td><td class="num">${n.attempts}</td>
          <td><span class="chip ${cls(n)}">${st(n)}</span></td><td class="num">${n.latency_ms!=null?nf(Math.round(n.latency_ms))+' ms':'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Nothing sent for this team yet.</td></tr>'}</tbody></table></div></section>`;}

/* ---- preferences, audit ---- */
function viewPreferences(){const t=T();
  return `<div><h1>Teams</h1><p class="muted">How ${esc(t.personal?t.oncall:'the '+t.name+' team')} is reached. Rules that notify “by preference” follow this table. It is read from <code>config/teams.yaml</code>; changing it on this screen is not built yet.</p></div>
    <div class="grid2"><section class="card"><h2>On call now</h2><p><b>${esc(t.oncall)}</b></p>${t.rota.length?`<dl class="kv">${t.rota.map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>`:'<p class="note">No rota: alerts go straight to this person.</p>'}</section>
      <section class="card"><h2>People</h2><dl class="kv">${t.members.map(m=>`<dt>${esc(m[0])}</dt><dd>${esc(m[1])}</dd>`).join('')}</dl></section></div>
    <section class="card"><h2>Channel by severity</h2><div class="scroll-x"><table><thead><tr><th>Severity</th>${CHS.map(c=>`<th>${CH[c]}</th>`).join('')}</tr></thead><tbody>
      ${['critical','error','warning','info'].map(s=>`<tr><td>${sevTag(s)}</td>${CHS.map(c=>`<td><input type="checkbox" disabled aria-label="${SEVS[s].label} by ${CH[c]}" ${(t.prefs[s]||[]).includes(c)?'checked':''}></td>`).join('')}</tr>`).join('')}</tbody></table></div>
      ${S.meta?`<dl class="kv">${['critical','error','warning','info'].map(s=>`<dt>${SEVS[s].label}</dt><dd>${esc(S.meta.severities[s].meaning)} <span class="muted">${esc(S.meta.severities[s].response)}</span></dd>`).join('')}</dl>`:''}</section>`;}
const AUDIT_WORDS={ack:'Acknowledged alert',resolve:'Resolved alert',incident_manager:'Took charge of alert',step_done:'Completed runbook step',action_run:'Ran runbook step',
  approval_requested:'Asked for approval',approved:'Approved runbook step',rejected:'Rejected runbook step',note:'Added a note',rule_saved:'Saved rule',runbook_saved:'Saved runbook',assigned:'Handed the alert over',platform_connected:'Connected a platform'};
function auditDetail(d){d=d||{};const p=[];if(d.text)p.push(d.text);if(d.to)p.push('to '+pname(d.to));if(d.name)p.push(d.name);if(d.step!=null)p.push('step '+d.step);if(d.action&&d.action!=='manual')p.push(d.action);
  if(d.via)p.push({ui:'in Herald',sms:'by SMS reply'}[d.via]||d.via);if(d.version!=null)p.push('version '+d.version);if(d.rule)p.push('rule '+d.rule);
  if(d.result)p.push(d.result.ok?'succeeded':'failed');return p.join(' · ');}
function targetName(t){t=String(t);const i=t.indexOf(':'),k=t.slice(0,i),v=t.slice(i+1);
  if(k==='alert'){const a=alertById(v);return 'Alert'+(a?': '+a.title:' '+v);}if(k==='rule'){const r=ruleById(v);return 'Rule: '+(r?r.name:v);}if(k==='runbook')return 'Runbook: '+((S.runbooks[v]||{}).title||v);if(k==='platform')return 'Platform: '+platName(v);return t;}
function viewAudit(){
  return `<div><h1>Activity log</h1><p class="muted">Every acknowledgement, resolution, runbook step, approval and rule change for this team, with who did it. Entries can only be added: the database refuses edits, and each entry carries a fingerprint of the one before it.</p></div>
    ${S.auditDenied?'<div class="banner info">'+sso('The history is open to team leads. Choose the team lead under “Viewing as” at the top to read it.','The activity log is open to team leads and approvers.')+'</div>'
      :`<div class="banner ${S.auditIntact?'info':''}">${S.auditIntact?'Chain checked by the service: no entry has been altered or removed.':'<b>The chain is broken.</b> An entry has been altered or removed.'}</div>
    <section class="card"><div class="scroll-x"><table><thead><tr><th>Time</th><th>Who</th><th>What</th><th>On</th><th class="tech-only">Fingerprint</th></tr></thead><tbody>
      ${S.audit.map(e=>`<tr><td class="num">${clock(Date.parse(e.at))}</td><td style="white-space:nowrap">${esc(pname(e.actor))}</td><td>${esc(AUDIT_WORDS[e.action]||String(e.action).replace(/_/g,' '))}${auditDetail(e.detail)?`<div class="note" style="overflow-wrap:anywhere">${esc(auditDetail(e.detail))}</div>`:''}</td><td>${esc(targetName(e.target))}</td><td class="mono tech-only">${esc(String(e.hash).slice(0,10))}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Nothing recorded for this team yet.</td></tr>'}</tbody></table></div></section>`}`;}

/* ---- chrome ---- */
function navHtml(){const mine=S.alerts.filter(a=>a.status!=='resolved'&&a.imRef===me()).length,open=S.alerts.filter(a=>a.status==='firing').length;
  const forYou=S.view==='feed'&&S.f.assignee===me();
  const item=(view,label,icon,extra,cur)=>`<button class="navb" data-act="nav" data-view="${view}" ${cur?'aria-current="page"':''}>${ic(icon)}<span class="nl">${label}</span>${extra||''}</button>`;
  return item('foryou','For you','person_circle',mine?`<span class="cnt">${mine}</span>`:'',forYou)

/* ---- Logs: every event Herald received, searchable. It reads the sample the service keeps (the latest 200 events). ---- */
const LG_RANGES=[['15m','15 min',9e5,'Past 15 minutes'],['1h','1 hour',36e5,'Past 1 hour'],['24h','24 hours',864e5,'Past 1 day'],['all','All kept',0,'Everything kept']];
const LG_FACETS=[['platform','Platform'],['severity','Severity'],['outcome','What Herald did'],['type','Type'],['service','Service']];
const LG_OUT={alert:'Raised an alert',resolved:'Closed an alert',none:'No rule matched'};
const LG_MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
async function loadLogs(){if(!S.lg.live&&S.logs.length)return;S.logs=(await api('/api/events/recent?limit=200')).map(mapEvent);}
const evById=id=>S.events.find(e=>e.id===id)||S.logs.find(e=>e.id===id);
function lgContent(e){const r=e.raw;if(typeof r==='string')return r;if(!r||typeof r!=='object')return String(r);
  const m=r.message||(r.error&&r.error.message)||(r.annotations&&r.annotations.summary)||(r.payload&&r.payload.reason)||'';
  let j='';try{j=JSON.stringify(r);}catch(x){}
  return (typeof m==='string'&&m?m+'  ':'')+j;}
function lgRow(e){const p=plat(e.source),text=lgContent(e),sev=String(e.attrs.severity||'none').toLowerCase();
  const r={e,platform:e.source,pname:p?p.name:e.source,severity:sev,type:String(e.attrs.type||'(no type)'),service:String(e.attrs.service||'(none)'),
    outcome:e.fired.length?'alert':e.closed.length?'resolved':'none',text};
  r.blob=(text+' '+r.type+' '+r.service+' '+r.pname+' '+r.platform).toLowerCase();return r;}
/* The search box takes plain words and key:value pairs; a space means "and", the word OR means "or", a leading minus means "not".
   Example: timeout severity:error (platform:workflow OR platform:pricing) -type:heartbeat */
function lgParse(q){const out={groups:[],keys:[],terms:[]},re=/(-?)(?:(\w+):)?(?:"([^"]*)"|([^\s()]+))/g,alias={source:'platform',host:'platform',status:'severity',level:'severity',result:'outcome'};let m,orNext=false;
  while((m=re.exec(String(q||'').replace(/[()]/g,' ')))){const raw=m[3]!=null?m[3]:m[4];if(!raw)continue;
    if(m[3]==null&&!m[2]&&/^or$/i.test(raw)){orNext=true;continue;}
    if(m[3]==null&&!m[2]&&/^and$/i.test(raw))continue;
    const v=raw.toLowerCase(),k=m[2]?(alias[m[2].toLowerCase()]||m[2].toLowerCase()):null;
    const c=k&&LG_FACETS.some(f=>f[0]===k)?{k,v,not:!!m[1]}:{k:null,v:(m[2]?m[2].toLowerCase()+':':'')+v,not:!!m[1]};
    if(orNext&&out.groups.length)out.groups[out.groups.length-1].push(c);else out.groups.push([c]);orNext=false;
    (c.k?out.keys:out.terms).push(c);}
  return out;}
function lgCond(r,c){const hit=c.k?(c.k==='platform'?[r.platform.toLowerCase(),r.pname.toLowerCase()]:c.k==='outcome'?[r.outcome,LG_OUT[r.outcome].toLowerCase()]:[String(r[c.k]).toLowerCase()]).some(x=>x.includes(c.v)):r.blob.includes(c.v);return hit!==c.not;}
function lgMatch(r,pq,skip){if(!pq.groups.every(g=>g.some(c=>lgCond(r,c))))return false;
  for(const f of LG_FACETS){if(f[0]===skip)continue;const off=S.lg.off[f[0]];if(off&&off.includes(r[f[0]]))return false;}
  return true;}
function lgWindow(all){const now=Date.now();if(S.lg.win)return S.lg.win;const rg=LG_RANGES.find(x=>x[0]===S.lg.range)||LG_RANGES[3];
  if(rg[2])return [now-rg[2],now];if(!all.length)return [now-36e5,now];
  const ts=all.map(r=>r.e.at),a=Math.min(...ts),b=Math.max(...ts);return [a,Math.max(b,a+6e4)];}
function lgData(){const all=S.logs.map(lgRow),pq=lgParse(S.lg.q),win=lgWindow(all),inWin=all.filter(r=>r.e.at>=win[0]&&r.e.at<=win[1]);
  return {all,pq,win,inWin,rows:inWin.filter(r=>lgMatch(r,pq))};}
function lgStamp(t){const d=new Date(t);return LG_MON[d.getMonth()]+' '+pad(d.getDate())+' '+clock(t);}
function lgChart(rows,win){const N=48,a=win[0],b=win[1],step=(b-a)/N,counts=new Array(N).fill(0);
  rows.forEach(r=>{counts[Math.min(N-1,Math.max(0,Math.floor((r.e.at-a)/step)))]++;});
  const max=Math.max(1,...counts),long=b-a>=864e5,fmt=t=>{const d=new Date(t);return (long?LG_MON[d.getMonth()]+' '+d.getDate()+', ':'')+pad(d.getHours())+':'+pad(d.getMinutes())+(b-a<72e5?':'+pad(d.getSeconds()):'');};
  return `<figure class="lgchart" role="group" aria-label="Events over time: ${rows.length} event${rows.length===1?'':'s'} between ${fmt(a)} and ${fmt(b)}">
    <div class="lgy" aria-hidden="true"><span>${max}</span><span>0</span></div>
    <div class="lgbars">${counts.map((n,i)=>{const t0=a+i*step,t1=a+(i+1)*step,tip=n+' event'+(n===1?'':'s')+' · '+fmt(t0)+' – '+fmt(t1);
      return `<button class="lgbar" data-act="lgBucket" data-a="${Math.floor(t0)}" data-b="${Math.ceil(t1)}" ${n?'':'disabled'} aria-label="${tip}. Show only these." data-tip="${tip}"><i style="height:${n?Math.max(6,Math.round(n/max*100)):0}%"></i></button>`;}).join('')}</div>
    <div class="lgx" aria-hidden="true"><span>${fmt(a)}</span><span>${fmt(a+(b-a)/2)}</span><span>${fmt(b)}</span></div></figure>`;}
/* Filters work like the reference: everything is ticked to begin with; untick a value to leave it out. */
function lgFacets(inWin,pq){return LG_FACETS.map(f=>{const key=f[0],counts={};inWin.filter(r=>lgMatch(r,pq,key)).forEach(r=>{counts[r[key]]=(counts[r[key]]||0)+1;});
  const off=S.lg.off[key]||[];off.forEach(v=>{if(!(v in counts))counts[v]=0;});
  const keys=Object.keys(counts).sort((x,y)=>counts[y]-counts[x]||x.localeCompare(y)).slice(0,12);
  const name=v=>key==='platform'?((plat(v)||{}).name||v):key==='outcome'?LG_OUT[v]:key==='severity'?(SEVS[v]?SEVS[v].label:'No severity'):v;
  return `<section class="lgf"><h3>${f[1]}</h3>${keys.map(v=>`<button class="lgchk" role="checkbox" aria-checked="${!off.includes(v)}" data-act="lgFacet" data-f="${key}" data-v="${esc(v)}"><span class="bx" aria-hidden="true"></span><span class="nl" title="${esc(name(v))}">${esc(name(v))}</span><span class="num">${counts[v]}</span></button>`).join('')||'<p class="muted" style="margin:0">No events in this time range</p>'}</section>`;}).join('');}
function lgMark(text,pq){let h=esc(text.length>420?text.slice(0,420)+'…':text);
  pq.terms.filter(t=>!t.not&&t.v.length>1).forEach(t=>{const v=esc(t.v).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');h=h.replace(new RegExp(v,'gi'),m=>'\u0001'+m+'\u0002');});
