function lgCsvText(rows){const cell=v=>{let s=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
  return ['time,platform,severity,type,service,what_herald_did,content'].concat(rows.map(r=>[new Date(r.e.at).toISOString(),r.pname,r.severity,r.type,r.service,LG_OUT[r.outcome],r.text].map(cell).join(','))).join('\r\n');}
function viewLogs(){const d=lgData(),all=d.all,pq=d.pq,win=d.win,rows=d.rows;

    +`<div class="lgbox"><span class="lgbox-l">Search for</span><label class="lgbox-in">${ic('search','sm')}<input id="lgq" data-oni="lgq" value="${esc(S.lg.q)}" placeholder="timeout severity:error platform:workflow" aria-label="Search logs" autocomplete="off" spellcheck="false"></label>${S.lg.q?`<button class="iconbtn sm" data-act="lgClearQ" title="Clear the search" aria-label="Clear the search">${ic('dismiss','sm')}</button>`:''}</div>`
    +(narrowed?`<div class="row lgchips">${pq.groups.map(g=>g.map(chip).join('<span class="muted">or</span>')).join('')}${S.lg.win?`<span class="loz info">${lgStamp(win[0])} – ${lgStamp(win[1])}</span>`:''}${hidden?`<span class="loz">${hidden} value${hidden>1?'s':''} left out</span>`:''}<button class="btn link" data-act="lgClear">Clear all filters</button></div>`
      :'<p class="help" style="margin:0;display:block;max-width:none">Type words to search the text. Add <code>severity:error</code>, <code>platform:workflow</code>, <code>type:…</code> or <code>service:…</code> to narrow down, <code>OR</code> between alternatives, and a minus in front of anything to leave it out.</p>')
    +lgChart(rows,win)
    +`<div class="lglayout"><aside class="lgfacets" aria-label="Filters">${lgFacets(d.inWin,pq)}</aside>

      ${rows.length?`<div class="tablewrap"><table class="lgtable"><thead><tr><th style="width:136px">Date</th><th>Platform</th><th>Severity</th><th>Service</th><th>Content</th><th>What Herald did</th></tr></thead><tbody>
        ${rows.map(r=>`<tr class="clickable lr-${esc(r.severity)}" data-act="openEvent" data-id="${r.e.id}" tabindex="0" aria-label="Open the event received ${lgStamp(r.e.at)} from ${esc(r.pname)}"><td>${lgStamp(r.e.at)}</td><td><span class="plat">${ptile(r.platform)}${esc(r.pname)}</span></td><td>${SEVS[r.severity]?sevTag(r.severity):'<span class="muted">None</span>'}</td><td>${r.service==='(none)'?'<span class="muted">None</span>':esc(r.service)}</td><td><div class="lgtext">${r.type==='(no type)'?'':`<code>${esc(r.type)}</code> `}${lgMark(r.text,pq)}</div></td><td>${r.outcome==='alert'?loz('Alert','danger'):r.outcome==='resolved'?loz('Resolved','success'):'<span class="muted">No rule matched</span>'}</td></tr>`).join('')}</tbody></table></div>`

/* The sidebar's edge can be dragged; the width is kept in the browser. A double click puts it back. */
(function(){const g=$('navgrip');if(!g)return;const set=x=>{x=Math.max(200,Math.min(440,Math.round(x)));document.documentElement.style.setProperty('--navw',x+'px');g.setAttribute('aria-valuenow',x);return x;};
  let w=240;try{w=+localStorage.getItem('herald.navw')||240;}catch(e){}w=set(w);
  const save=()=>{try{localStorage.setItem('herald.navw',String(w));}catch(e){}};
  g.addEventListener('pointerdown',e=>{e.preventDefault();try{g.setPointerCapture(e.pointerId);}catch(x){}g.classList.add('on');document.body.classList.add('resizing');});
  g.addEventListener('pointermove',e=>{if(g.classList.contains('on'))w=set(e.clientX);});
  const end=()=>{if(!g.classList.contains('on'))return;g.classList.remove('on');document.body.classList.remove('resizing');save();};
  g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
  g.addEventListener('dblclick',()=>{w=set(240);save();});
  g.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();w=set(w+(e.key==='ArrowLeft'?-16:16));save();}});})();
document.addEventListener('click',e=>{
  const el=e.target.closest?e.target.closest('[data-act]'):null;
  if(S.simOpen&&!(e.target.closest&&e.target.closest('#simWrap'))){S.simOpen=false;if(!el){render();return;}}
  if(!el||!ACT[el.dataset.act])return;if(el.disabled)return;
  ACT[el.dataset.act](el,e);render();
  if(el.dataset.act==='openAlert'||el.dataset.act==='openEvent'||el.dataset.act==='gotoAlert'){const c=$('drClose');if(c){$('drawerBody').scrollTop=0;try{c.focus();}catch(x){}}}
});
document.addEventListener('input',e=>{const el=e.target.closest?e.target.closest('[data-oni]'):null;if(!el||!ONI[el.dataset.oni])return;if(ONI[el.dataset.oni](el)!==false)refreshSide();});
document.addEventListener('change',e=>{const el=e.target.closest?e.target.closest('[data-onc]'):null;if(!el||!ONC[el.dataset.onc])return;ONC[el.dataset.onc](el);render();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.simOpen){S.simOpen=false;render();}else if(S.drawer){S.drawer=null;render();}return;}
  if(e.key!=='Enter')return;const t=e.target;
  if(t.id==='smsReply'){e.preventDefault();ACT.smsSend();render();}
  else if(t.id==='nlText'){e.preventDefault();ACT.nlDraft();render();}
  else if(t.matches&&t.matches('article[data-act],tr[data-act]')){e.preventDefault();ACT[t.dataset.act](t);render();}
});
window.addEventListener('hashchange',()=>{const v=location.hash.replace('#','');if(VIEWS[v]&&v!==S.view){S.view=v;S.draft=null;render();loadView().then(render,()=>{});}});
setInterval(()=>{const c=$('obClock');if(c&&S.ob.t0&&!S.ob.alertAt)c.textContent=mmss(Date.now()-S.ob.t0);},500);

document.addEventListener('click',e=>{if(S.menu&&!(e.target.closest&&e.target.closest('.create,.who'))){S.menu=null;render();}},true);
/* Board: drag a card to Acknowledged or Resolved. The service decides; the board redraws from what it says. */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.bcard');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move';c.classList.add('dragging');});
document.addEventListener('dragend',e=>{document.querySelectorAll('.dragging,.over').forEach(n=>n.classList.remove('dragging','over'));});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.bcol');if(!c)return;e.preventDefault();document.querySelectorAll('.bcol.over').forEach(n=>{if(n!==c)n.classList.remove('over');});c.classList.add('over');});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('.bcol');if(!c)return;e.preventDefault();c.classList.remove('over');
  const a=alertById(e.dataTransfer.getData('text/plain')),to=c.dataset.col;if(!a||a.status===to)return;
  if(to==='acked'&&a.status==='firing')ACT.ack({dataset:{id:a.id}});
  else if(to==='resolved')ACT.resolve({dataset:{id:a.id}});
  else{toast(a.status==='resolved'?'A resolved alert stays resolved. If the problem returns, a new alert opens.':'An acknowledged alert cannot go back to Open. Change the assignee to hand it over.');render();}});

/* ============ start ============ */
/* Links in emails and texts look like #alert-17: open that alert. */
async function deepLink(){const m=/^#alert-(\d+)$/.exec(location.hash);if(!m||!S.ready)return;
  try{const a=await api('/api/alerts/'+m[1],{admin:true});   /* demo: find whose alert it is, and look at it as them */
    if(a.owner!==T().owner&&canSwitchTo(teamKey(a.owner))&&TEAMS[teamKey(a.owner)].owner===a.owner){S.team=teamKey(a.owner);if(!OIDC())S.role='responder';await reloadFor();}}catch(e){}
  S.view='feed';S.platform=null;S.f.assignee='';S.f.platform='';S.f.resolved=true;ACT.openAlert({dataset:{id:m[1]}});render();}
/* Ask the service who is signed in. With single sign-on and no session it answers 401: go to the sign-in page and come back here.
   A service without /api/me (or one that cannot be reached) is treated as demo mode, so the demo works exactly as before. */
async function loadMe(){let r=null,d=null;try{r=await fetch('/api/me',{credentials:'same-origin',headers:{'Accept':'application/json'}});d=await r.json();}catch(e){}
  if(r&&r.status===401){let u;try{u=new URL(d&&typeof d.login_url==='string'?d.login_url:'/login',location.origin);}catch(e){}
    if(!u||u.origin!==location.origin)u=new URL('/login',location.origin);
    u.searchParams.set('next',location.pathname+location.search+location.hash);leaving=true;location.replace(u.pathname+u.search);return false;}
  ME=r&&r.ok&&d&&d.mode==='oidc'?d:{mode:'demo'};return true;}
async function boot(){
  try{if(!await loadMe())return;
    await loadDirectory();
    if(OIDC()){S.role=UI_ROLE[ME.role]||'responder';const ok=myTeams();S.team=(ME.teams||[]).find(k=>ok.includes(k))||ok[0]||null;
      if(!S.team){S.noTeam=true;render();return;}}
    const [meta,sources,samples]=await Promise.all([api('/api/meta'),api('/api/sources'),api('/api/sim/samples').catch(()=>({}))]);
    S.meta=meta;S.sources=sources;S.samples=samples;await Promise.all([loadAll(),loadPhone()]);S.ready=true;S.error=null;
  }catch(e){S.error=e.message||'The service did not answer.';render();return;}
  const v=location.hash.replace('#','');if(VIEWS[v]){S.view=v;await loadView().catch(()=>{});}
  render();connect();deepLink();
  if(OIDC()){try{if(sessionStorage.getItem('herald.stepup')){sessionStorage.removeItem('herald.stepup');toast('You confirmed it is you. Nothing was done yet: press the button again to finish.');render();}}catch(e){}}
  window.addEventListener('hashchange',deepLink);
  /* A safety net behind the push stream. It redraws only when something actually changed. */
  let lastSig='';const sig=()=>JSON.stringify([S.events.map(e=>e.id),S.deliveries.map(d=>[d.id,d.status,d.attempts]),S.audit.length,S.logs.length&&S.logs[0].id,S.phone.messages.length,S.phone.down,S.mail.messages.length,Object.keys(S.runbooks),S.ob.gotAt,S.ob.alertAt]);
  setInterval(()=>{if(document.hidden||!S.ready)return;Promise.all([loadEvents(),loadView()]).then(()=>{const now=sig();if(now!==lastSig){lastSig=now;if(!S.draft)render();}},()=>{});},5000);
}
window.__herald={S:S,ACT:ACT,render:render,api:api};
try{setMode(localStorage.getItem('herald.view')==='technical');}catch(e){setMode(false);}
render();boot();
})();
