[project]
name = "herald"
version = "0.1.0"
description = "Flexible alerting and notification service (hackathon skeleton)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "orjson>=3.10",
    "asyncpg>=0.30",
    "aiokafka[snappy,lz4,zstd]>=0.12",  # producers choose the codec, so read them all
    "httpx>=0.27",
    "aiosmtplib>=3.0",
    "watchfiles>=0.22",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.8",  # verifies ID tokens from the sign-in provider (alertsvc/auth.py)
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alertsvc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
