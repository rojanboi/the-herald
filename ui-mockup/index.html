  nightToggle(){S.night=!S.night;},
  filter(el){S.f[el.dataset.k]=el.dataset.v;},
  filterReset(){S.f={status:'all',sev:'all'};},
  testEvent(){sim({settlements:'workflow',pricing:'pricing',rates:'trade',anna:'metric'}[S.team]);},
  openAlert(el){S.drawer={kind:'alert',id:el.dataset.id};},
  gotoAlert(el){const a=alertById(el.dataset.id);if(!a)return;S.team=teamKey(a.owner);go('feed');if(a.status==='resolved'&&S.f.status!=='all')S.f.status='all';S.drawer={kind:'alert',id:a.id};},
  openEvent(el){S.drawer={kind:'event',id:el.dataset.id};},
  closeDrawer(){S.drawer=null;},
  ack(el){const a=alertById(el.dataset.id);if(a)ackAlert(a,actor(),'in Herald');},
  resolve(el){const a=alertById(el.dataset.id);if(a)resolveAlert(a,actor(),'marked resolved in Herald');},
  runStep(el){const a=alertById(el.dataset.id);if(a)runStep(a,+el.dataset.i);},
  approve(el){const ap=S.approvals.find(x=>x.id===el.dataset.id);if(!ap||ap.status!=='pending')return;const b=approvalBlock(ap,actor(),true);if(b){toast(b);return;}decide(ap,true,actor(),'in Herald');},
  reject(el){const ap=S.approvals.find(x=>x.id===el.dataset.id);if(!ap||ap.status!=='pending')return;
    if(actor()!==ap.requestedBy&&approvalBlock(ap,actor(),true)){toast('Only a team lead can reject this step.');return;}decide(ap,false,actor(),'in Herald');},
  openPhone(el){S.phone=el.dataset.who;S.drawer=null;go('deliveries');},
  newRule(){startEdit(blankRule(),true,false);},
  editRule(el){const r=ruleById(el.dataset.id);if(r)startEdit(clone(r),false,false);},
  ruleFromEvent(el){const ev=S.events.find(e=>e.id===el.dataset.id);const d=blankRule();startEdit(d,true,false,ev&&ev.id);go('rules');S.draft=d;},
  cancelEdit(){S.draft=null;},
  becomeEditor(){S.role='editor';},
  saveRule(){const d=S.draft;if(!canEdit())return;if(!d.name.trim()){toast('Give the rule a name before saving.');const n=$('dName');if(n)n.focus();return;}
    d.version=(d.version||0)+1;
    if(d.id){const i=S.rules.findIndex(r=>r.id===d.id);S.rules[i]=d;}else{d.id='r-'+(++seq);d.hits=0;S.rules.push(d);}
    audit(actor(),S.draftNew?'Created rule':'Changed rule',d.name+' (v'+d.version+')',S.draftAI?'started from an AI draft':'');
    S.draft=null;toast('Rule saved. It applies to the next event.');},
  addCond(el){kids(nodeAt(el.dataset.path)).push({field:'',op:'eq',value:''});},
  addGroup(el){kids(nodeAt(el.dataset.path)).push({any:[{field:'',op:'eq',value:''}]});},
  delCond(el){const p=parentOf(el.dataset.path);kids(p.parent).splice(p.idx,1);},
  pickField(el){const path=el.dataset.path,ev=S.events.find(e=>e.id===S.edSample)||S.events[0];const v=ev?ev.flat[path]:'';
    const root=S.draft.when;const target=root.all?root.all:kids(root);target.push({field:path,op:typeof v==='number'?'gte':'eq',value:Array.isArray(v)?v.join(', '):v});},
  addNt(){S.draft.notify.push({to:S.draft.owner.indexOf('person:')===0?S.draft.owner:'team:'+teamKey(S.draft.owner),channels:['email']});},
  delNt(el){S.draft.notify.splice(+el.dataset.i,1);},
  nlPick(el){const c=CANNED[+el.dataset.i];S.nlText=c.text;startEdit(c.make(),true,true);},
  nlDraft(){const t=S.nlText.toLowerCase();let best=null,bs=0;CANNED.forEach(c=>{const s=c.keys.filter(k=>t.indexOf(k)>=0).length;if(s>bs){bs=s;best=c;}});
    if(!best){toast('This prototype only understands the three example sentences under the box.');return;}startEdit(best.make(),true,true);},
  reviewRb(el){const rb=S.runbooks[el.dataset.id];if(!rb||!canEdit())return;rb.reviewedBy=actor();audit(actor(),'Reviewed runbook',rb.title,'AI-drafted steps accepted');},
  parsePaste(){S.pasteSteps=parseRunbook(S.pasteText);},
  pasteExample(){S.pasteText='When the reconciliation job is killed, check the memory graph for the host. If memory was at the limit: restart the job with the large profile (needs approval from the team lead). Wait 10 minutes, and if it fails again, escalate to the platform team.';S.pasteSteps=parseRunbook(S.pasteText);},
  phoneTab(el){S.phone=el.dataset.who;S.smsDraft='';},
  smsSend(){const t=S.smsDraft.trim();if(!t)return;S.smsDraft='';smsReply(S.phone,t);},
  smsQuick(el){smsReply(S.phone,el.dataset.t);},
  key(el){const c=S.calls.find(x=>x.id===el.dataset.id);if(!c||c.state!=='ringing')return;const a=alertById(c.alert),d=el.dataset.d;
    if(d==='1'){c.state='ended';c.note='pressed 1, acknowledged';ackAlert(a,c.to,'phone keypad');}
    else if(d==='2'){c.state='ended';c.note='pressed 2, passed to the team lead';const lead=TEAMS[teamKey(a.owner)].lead;
      pushSms(lead,'in','Passed to you by '+c.to+': '+smsText(a));tl(a,Date.now(),c.to+' passed the alert to '+lead+' from the phone keypad');audit(c.to,'Escalated alert',a.title,'phone keypad, to '+lead);}
    else if(d==='x'){c.state='ended';c.note='hung up';tl(a,Date.now(),c.to+' hung up without acknowledging');}},
  mailSel(el){S.emailSel=el.dataset.id;},
  copy(el){const n=$(el.dataset.src);if(!n)return;const txt=n.textContent;const fb=()=>{try{const r=document.createRange();r.selectNodeContents(n);const s=window.getSelection();s.removeAllRanges();s.addRange(r);}catch(e){}toast('Text selected. Press Ctrl or Cmd + C to copy.');};
    try{navigator.clipboard.writeText(txt).then(()=>toast('Copied.'),fb);}catch(e){fb();}},
  obSrc(el){const o=S.ob;if(!o.t0)o.t0=Date.now();o.src=el.dataset.src;},
  obSend(){const o=S.ob;if(!o.t0)o.t0=Date.now();const src={kafka:'kafka:scheduler-events',logfile:'logfile:scheduler'}[o.src]||'webhook:scheduler';
    const ev=ingest(clone(SAMPLES.unseen.raw),src);if(!o.gotAt){o.gotAt=Date.now();o.eventId=ev.id;}
    if(ev.results.some(r=>r.alert)){if(!o.accepted)o.preMatched=true;if(!o.alertAt)o.alertAt=Date.now();}},
  obAccept(){if(!canEdit())return;const r=batchRule(T().owner);r.id='r-'+(++seq);r.version=1;r.hits=0;S.rules.push(r);S.ob.accepted=true;audit(actor(),'Created rule',r.name+' (v1)','accepted from the suggestion when connecting a source');},
  obEdit(){startEdit(batchRule(T().owner),true,false,S.ob.eventId);},
  obReset(){S.ob={src:null,t0:null,gotAt:null,eventId:null,accepted:false,alertAt:null,preMatched:false};}
};
const ONI={
  dName(el){S.draft.name=el.value;},
  dTitle(el){S.draft.present.title=el.value;},
  dBody(el){S.draft.present.body=el.value;},
  dFields(el){S.draft.present.fields=list(el.value);},
  dHi(el){S.draft.present.highlight=list(el.value);},
  dGrpBy(el){S.draft.group.by=list(el.value);},
  condField(el){nodeAt(el.dataset.path).field=el.value.trim();},
  condVal(el){const n=nodeAt(el.dataset.path),v=el.value;
    if(n.op==='in')n.value=list(v);else if(['gt','gte','lt','lte'].includes(n.op)&&v.trim()!==''&&!isNaN(Number(v.replace(/,/g,''))))n.value=Number(v.replace(/,/g,''));else n.value=v;},
  nlText(el){S.nlText=el.value;return false;},
  smsDraft(el){S.smsDraft=el.value;return false;},
  pasteText(el){S.pasteText=el.value;return false;}
};
const ONC={
  team(el){S.team=el.value;S.drawer=null;S.phone=null;if(S.draft&&S.draftNew&&!S.draft.name)S.draft=null;},
  role(el){S.role=el.value;},
  ruleToggle(el){const r=ruleById(el.dataset.id);if(!r||!canEdit())return;r.enabled=el.checked;audit(actor(),el.checked?'Switched rule on':'Switched rule off',r.name);},
  grpMode(el){const path=el.dataset.path,m=el.value;const n=nodeAt(path);const ks=kids(n);const nn=m==='all'?{all:ks}:m==='any'?{any:ks}:{not:{any:ks}};
    if(path==='')S.draft.when=nn;else{const p=parentOf(path);kids(p.parent)[p.idx]=nn;}},
  condOp(el){const n=nodeAt(el.dataset.path);n.op=el.value;if(n.op==='exists')n.value='';else if(n.op==='in'&&!Array.isArray(n.value))n.value=list(n.value);else if(n.op!=='in'&&Array.isArray(n.value))n.value=n.value.join(', ');},
  dOwner(el){S.draft.owner=el.value;},
  dSource(el){const root=S.draft.when;let ks=kids(root);const i=ks.findIndex(k=>k.field==='@source'&&k.op==='eq');if(i>=0)ks.splice(i,1);
    if(el.value){const leaf={field:'@source',op:'eq',value:el.value};if(root.all)root.all.unshift(leaf);else S.draft.when={all:[leaf,root]};}},
  dSev(el){S.draft.severity=el.value;},
  dColour(el){S.draft.present.colour=el.value;},
  dWindow(el){S.draft.group.window=el.value;},
  dRunbook(el){S.draft.runbook=el.value||null;},
  ntTo(el){S.draft.notify[+el.dataset.i].to=el.value;},
  ntCh(el){const n=S.draft.notify[+el.dataset.i],c=el.dataset.ch;n.channels=CHS.filter(x=>x===c?el.checked:(n.channels||[]).includes(x));},
  ntElse(el){const n=S.draft.notify[+el.dataset.i],c=el.dataset.ch;n.else=CHS.filter(x=>x===c?el.checked:(n.else||[]).includes(x));},
  ntHours(el){const n=S.draft.notify[+el.dataset.i];if(el.checked){n.hours={from:'08:00',to:'20:00',tz:TEAMS[teamKey(S.draft.owner)].tz};n.else=n.else||['email'];}else{delete n.hours;delete n.else;}},
  ntHf(el){S.draft.notify[+el.dataset.i].hours.from=el.value;},
  ntHt(el){S.draft.notify[+el.dataset.i].hours.to=el.value;},
  edSample(el){S.edSample=el.value;},
  pref(el){const t=T(),s=el.dataset.s,c=el.dataset.ch;t.prefs[s]=CHS.filter(x=>x===c?el.checked:t.prefs[s].includes(x));audit(actor(),'Changed channel preference',t.name+': '+SEVS[s].label,(t.prefs[s].map(x=>CH[x]).join(', ')||'no channel'));},
  prefHours(el){const t=T();t.hours[+el.dataset.k]=el.value;audit(actor(),'Changed working hours',t.name,t.hours.join(' to '));}
};

/* ============ wiring ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest?e.target.closest('[data-act]'):null;
  if(S.simOpen&&!(e.target.closest&&e.target.closest('#simWrap'))){S.simOpen=false;if(!el){render();return;}}
  if(!el||!ACT[el.dataset.act])return;if(el.disabled)return;
  ACT[el.dataset.act](el,e);render();
  if(el.dataset.act==='openAlert'||el.dataset.act==='openEvent'||el.dataset.act==='gotoAlert'){const c=$('drClose');if(c){$('drawerBody').scrollTop=0;try{c.focus();}catch(x){}}}
});
document.addEventListener('input',e=>{const el=e.target.closest?e.target.closest('[data-oni]'):null;if(!el||!ONI[el.dataset.oni])return;if(ONI[el.dataset.oni](el)!==false)refreshSide();});
document.addEventListener('change',e=>{const el=e.target.closest?e.target.closest('[data-onc]'):null;if(!el||!ONC[el.dataset.onc])return;ONC[el.dataset.onc](el);render();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.simOpen){S.simOpen=false;render();}else if(S.drawer){S.drawer=null;render();}return;}
  if(e.key!=='Enter')return;const t=e.target;
  if(t.id==='smsReply'){e.preventDefault();ACT.smsSend();render();}
  else if(t.id==='nlText'){e.preventDefault();ACT.nlDraft();render();}
  else if(t.matches&&t.matches('article[data-act]')){e.preventDefault();ACT[t.dataset.act](t);render();}
});
window.addEventListener('hashchange',()=>{const v=location.hash.replace('#','');if(VIEWS[v]&&v!==S.view){S.view=v;S.draft=null;render();}});
setInterval(()=>{const c=$('obClock');if(c&&S.ob.t0&&!S.ob.alertAt)c.textContent=mmss(Date.now()-S.ob.t0);},500);

/* ============ seed a realistic working state ============ */
(function seed(){const t=Date.now(),m=60000;
  audit('Elena Fischer','Created rule','Order settlement failures in prod (v1)','',t-190*m);
  audit('Elena Fischer','Created rule','Pricing engine warnings (v1)','',t-176*m);
  audit('David Okafor','Created rule','Large rejected rates trades (v1)','',t-150*m);
  audit('Anna','Created rule','Anything critical from payments-api (v1)','',t-121*m);
  audit('Marcus Lindqvist','Reviewed runbook','Settlement timeout','',t-95*m);
  ingest(clone(SAMPLES.metric.raw),SAMPLES.metric.source,{at:t-11*m,seed:true});
  ingest(clone(SAMPLES.workflow.raw),SAMPLES.workflow.source,{at:t-6*m-20000,seed:true});
  ingest(clone(SAMPLES.trade.raw),SAMPLES.trade.source,{at:t-4*m-5000,seed:true});
  let first=null;for(let i=0;i<37;i++){const raw=clone(SAMPLES.pricing.raw);raw.latency_ms=1300+((i*53)%700);const ev=ingest(raw,SAMPLES.pricing.source,{at:t-3*m+i*4200,seed:true,store:i===0});if(!first)first=ev;}
  first.burstN=37;
  const v=(function(){try{return location.hash.replace('#','');}catch(e){return '';}})();if(VIEWS[v])S.view=v;
})();
window.__herald={S:S,ACT:ACT,ONC:ONC,ONI:ONI,render:render,ingest:ingest,sim:sim,parseRunbook:parseRunbook,ruleSentence:ruleSentence};
render();
})();
</script>
