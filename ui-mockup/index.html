<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Herald Alert Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
/* Layout: sticky top bar (team, role, simulate), left rail of screens on desktop that becomes a tab strip on phones,
   one working column, alert and event detail in a right-hand drawer. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --sunk:#e4eaef; --ink:#13212c; --muted:#566878; --line:#d3dbe2;
  --accent:#0b6b7d; --accent-ink:#ffffff; --accent-soft:#dbeef1;
  --crit:#b8202f; --crit-soft:#fbe4e6; --err:#b5480b; --err-soft:#fbe6d6; --warn:#855a00; --warn-soft:#fbeecb;
  --info:#2457b8; --info-soft:#e0eafb; --ok:#19713f; --ok-soft:#dcf1e4; --grey:#566878; --grey-soft:#e4eaef;
  --scrim:rgba(19,33,44,.45); --shadow:0 8px 30px rgba(19,33,44,.16);
  --font-display:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1419; --surface:#161f27; --sunk:#1d2832; --ink:#e4ebf1; --muted:#93a5b5; --line:#2b3945;
  --accent:#58c4d6; --accent-ink:#06242b; --accent-soft:#12363f;
  --crit:#ff8a93; --crit-soft:#47161c; --err:#ffab73; --err-soft:#45230f; --warn:#f2c14e; --warn-soft:#3d2f0a;
  --info:#8db4ff; --info-soft:#152a4f; --ok:#6fd39a; --ok-soft:#10361f; --grey:#93a5b5; --grey-soft:#1d2832;
  --scrim:rgba(0,0,0,.6); --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1419; --surface:#161f27; --sunk:#1d2832; --ink:#e4ebf1; --muted:#93a5b5; --line:#2b3945;
  --accent:#58c4d6; --accent-ink:#06242b; --accent-soft:#12363f;
  --crit:#ff8a93; --crit-soft:#47161c; --err:#ffab73; --err-soft:#45230f; --warn:#f2c14e; --warn-soft:#3d2f0a;
  --info:#8db4ff; --info-soft:#152a4f; --ok:#6fd39a; --ok-soft:#10361f; --grey:#93a5b5; --grey-soft:#1d2832;
  --scrim:rgba(0,0,0,.6); --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
table{font:inherit;color:inherit;border-collapse:collapse;width:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol,dl,dd,pre,fieldset{margin:0;padding:0}
ul,ol{list-style:none}
fieldset{border:0;min-width:0}
h1{font:700 26px/1.1 var(--font-display);letter-spacing:.005em;text-wrap:balance}
h2{font:600 17px/1.2 var(--font-display);letter-spacing:.01em;text-wrap:balance}
h3{font:600 14.5px/1.3 var(--font-body);overflow-wrap:anywhere}
code,pre,.mono{font-family:var(--font-mono);font-size:12.5px}
code{background:var(--sunk);padding:1px 4px;border-radius:3px;overflow-wrap:anywhere}
pre{background:var(--sunk);border-radius:6px;padding:10px 12px;overflow-x:auto;line-height:1.5;white-space:pre}
pre.wrap{white-space:pre-wrap;overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.lab{font:600 11px/1.3 var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:10px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:18px;height:18px;background:var(--accent);transform:rotate(45deg);border-radius:3px;flex:none}
.brand b{font:700 21px/1 var(--font-display);letter-spacing:.03em}
.proto{font:500 10.5px/1.2 var(--font-mono);color:var(--muted);border:1px dashed var(--muted);padding:3px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.06em}
.sels{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sels label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.sim{position:relative}
#simMenu{position:absolute;right:0;top:calc(100% + 6px);width:min(350px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:6px;z-index:12;max-height:72vh;overflow:auto}
.mh{padding:8px 10px 4px}
.mi{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;padding:7px 10px;border:0;background:none;border-radius:6px;cursor:pointer}
.mi:hover{background:var(--sunk)}
.mi small{color:var(--muted);font-size:12px}
.mi.tog{flex-direction:row;align-items:center;gap:10px}
.mi.tog>span:last-child{display:flex;flex-direction:column}
.sw{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface)}
.mi[aria-checked="true"] .sw{background:var(--accent)}
.mi[aria-checked="true"] .sw::after{left:16px}
@media (max-width:760px){ .sels{order:3;width:100%} }

/* shell */
.shell{display:grid;grid-template-columns:186px minmax(0,1fr);gap:26px;padding-block:20px 96px;max-width:1280px;margin:0 auto}
#nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;display:flex;flex-direction:column;gap:2px}
.navb{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:0;background:none;border-radius:6px;text-align:left;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.navb:hover{color:var(--ink)}
.navb[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nb{font:600 11px var(--font-mono);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:1px 6px;color:var(--ink)}
#main{min-width:0;display:flex;flex-direction:column;gap:16px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:12px;padding-block:10px 96px}
  #nav{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-weight:500;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.warn{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font-weight:500}
.in{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0;max-width:100%;width:100%}
select.in{width:auto}
textarea.in{resize:vertical;min-height:64px;line-height:1.4}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.segb{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--muted)}
.segb[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.row.top-al{align-items:flex-start}
.grow{flex:1 1 220px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.note{font-size:12.5px;color:var(--muted)}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:6px;padding:8px 12px;font-size:13px}
.banner.info{border-color:var(--info);background:var(--info-soft)}
.banner.ok{border-color:var(--ok);background:var(--ok-soft)}
.scroll-x{overflow-x:auto}
th{text-align:left;font:600 11px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}

/* severity, pills, chips */
.sev{display:inline-flex;gap:5px;align-items:center;font:600 11.5px/1.2 var(--font-body);letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:4px;white-space:nowrap}
.sev-critical{background:var(--crit-soft);color:var(--crit)} .sev-error{background:var(--err-soft);color:var(--err)}
.sev-warning{background:var(--warn-soft);color:var(--warn)} .sev-info{background:var(--info-soft);color:var(--info)}
.sev-debug{background:var(--grey-soft);color:var(--grey)}
.c-red{--c:var(--crit);--cs:var(--crit-soft)} .c-orange{--c:var(--err);--cs:var(--err-soft)} .c-amber{--c:var(--warn);--cs:var(--warn-soft)}
.c-blue{--c:var(--info);--cs:var(--info-soft)} .c-green{--c:var(--ok);--cs:var(--ok-soft)} .c-grey{--c:var(--grey);--cs:var(--grey-soft)}
.tile{width:36px;height:36px;border-radius:7px;display:grid;place-items:center;background:var(--cs);color:var(--c);font-size:16px;flex:none;border:1px solid var(--c)}
.count{font:600 12.5px/1.2 var(--font-mono);background:var(--ink);color:var(--surface);padding:2px 8px;border-radius:10px;font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:500;padding:2px 8px;border-radius:10px;border:1px solid var(--line);white-space:nowrap}
.pill.firing{border-color:var(--crit);color:var(--crit)} .pill.acked{border-color:var(--info);color:var(--info)} .pill.resolved{border-color:var(--ok);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.chip.delivered{color:var(--ok);border-color:var(--ok)}
.chip.retrying,.chip.pending{color:var(--warn);background:var(--warn-soft);border-color:var(--warn)}
.chip.parked{color:var(--crit);background:var(--crit-soft);border-color:var(--crit)}
.badge{font:600 11px/1.2 var(--font-body);padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.ap{background:var(--warn-soft);color:var(--warn)} .badge.ai{background:var(--info-soft);color:var(--info)} .badge.ok{background:var(--ok-soft);color:var(--ok)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ok);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
@media (prefers-reduced-motion:no-preference){ .dot.pulse{animation:pulse 1.6s ease-in-out infinite} }
@keyframes pulse{50%{opacity:.25}}

/* feed */
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.alert:hover{border-color:var(--muted)}
.alert.st-resolved{background:var(--sunk)}
.al-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.al-actions{display:flex;flex-direction:column;gap:6px}
@media (max-width:640px){ .alert{grid-template-columns:auto minmax(0,1fr)} .al-actions{grid-column:1/-1;flex-direction:row} }
.evrow{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.evrow:last-child{border-bottom:0}
.empty{border:1px dashed var(--muted);border-radius:8px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}

/* drawer */
#scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
#drawerHead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#drawerBody{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:20px;min-height:0;flex:1}
.sec{display:flex;flex-direction:column;gap:8px;min-width:0}
.kv{display:grid;grid-template-columns:minmax(90px,auto) minmax(0,1fr);gap:4px 14px}
.kv dt{color:var(--muted)} .kv dd{overflow-wrap:anywhere}
.kv dd.hi{color:var(--crit);font-weight:600}
.step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.sn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font:600 12px var(--font-mono);color:var(--muted)}
.sn.done{background:var(--ok);border-color:var(--ok);color:var(--surface)} .sn.failed{background:var(--crit);border-color:var(--crit);color:var(--surface)}
.sn.running,.sn.awaiting{border-color:var(--warn);color:var(--warn)}
.sb{display:flex;flex-direction:column;gap:6px;min-width:0}
.out{font:12.5px/1.45 var(--font-mono);background:var(--sunk);border-radius:5px;padding:6px 8px;overflow-wrap:anywhere}
.out.bad{color:var(--crit)}
.why li{display:flex;gap:8px;align-items:baseline;padding:2px 0;flex-wrap:wrap}
.why ul{padding-left:20px}
.tick{font-weight:700;width:14px;flex:none}
.tick.y{color:var(--ok)} .tick.n{color:var(--crit)}
.tl li{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;padding:3px 0}

/* rules */
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.rule-side{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
@media (max-width:640px){ .rule{grid-template-columns:minmax(0,1fr)} }
.stat{display:flex;flex-direction:column;min-width:64px}
.stat b{font:600 15px var(--font-mono);font-variant-numeric:tabular-nums}
.ed-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1040px){ .ed-grid{grid-template-columns:minmax(0,1fr)} }
.ed-form,.ed-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.wcard{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px}
.wkey{font:700 15px/1.2 var(--font-display);color:var(--accent);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
@media (max-width:520px){ .wcard{grid-template-columns:minmax(0,1fr);gap:6px} }
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>span{font-size:12.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.grp{border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.grp .grp{background:var(--surface)}
.cond{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.1fr) auto;gap:6px;align-items:center}
@media (max-width:560px){ .cond{grid-template-columns:minmax(0,1fr) auto} .cond>.in{grid-column:1} .cond>.x{grid-column:2;grid-row:1} }
.x{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:30px;height:30px;cursor:pointer;line-height:1}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.ntf{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px}
.sentence{font:500 15.5px/1.45 var(--font-body);text-wrap:pretty}
.jf{border:0;background:none;padding:0 2px;margin:0;font:inherit;color:inherit;cursor:pointer;border-radius:3px;text-align:left}
.jf:hover{background:var(--accent-soft);color:var(--accent)}
.match li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px;padding:3px 0;font-size:13px}
.prev{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.smsb{background:var(--sunk);border-radius:12px;padding:8px 10px;font-size:13px;overflow-wrap:anywhere;max-width:300px}
.var{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 3px;font-family:var(--font-mono);font-size:12.5px}

/* runbooks */
.rb-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px}
@media (max-width:900px){ .rb-grid{grid-template-columns:minmax(0,1fr)} }
.rstep{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.rstep:last-child{border-bottom:0}

/* deliveries */
.dl-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){ .dl-grid{grid-template-columns:minmax(0,1fr)} }
.phone{border:2px solid var(--ink);border-radius:24px;padding:12px;background:var(--sunk);display:flex;flex-direction:column;gap:10px;max-width:360px;width:100%}
.thread{height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px}
.bub{max-width:88%;padding:7px 10px;border-radius:12px;font-size:13px;overflow-wrap:anywhere}
.bub.in{background:var(--surface);align-self:flex-start;border:1px solid var(--line)}
.bub.out{background:var(--accent);color:var(--accent-ink);align-self:flex-end}
.bub small{display:block;opacity:.75;font-size:11px;margin-top:2px}
.call{background:var(--surface);border:1px solid var(--ok);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.key{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.key b{font:600 16px var(--font-mono)} .key small{font-size:10px;color:var(--muted);min-height:11px}
.key.act{border-color:var(--accent)} .key.act small{color:var(--accent)}
.mail{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 10px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.mrow[aria-pressed="true"]{background:var(--accent-soft)}
.mbody{padding:12px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.ptabs{display:flex;gap:4px;flex-wrap:wrap}
.ptab{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;color:var(--muted)}
.ptab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}

/* preferences, connect */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.ob{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
.obn{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 13px var(--font-mono)}
.obn.done{background:var(--ok);color:var(--surface)}
.clockbox{font:600 22px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.wait{display:inline-flex;align-items:center;gap:8px;font-weight:500;color:var(--warn)}
.wait .dot{background:var(--warn)}
.wait.got{color:var(--ok)} .wait.got .dot{background:var(--ok)}

/* toasts */
#toasts{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;

(function(){

const joinAnd=(a,w)=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' '+(w||'and')+' '+a[a.length-1];
const list=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean);

/* ============ reference data ============ */
const SEVS={critical:{label:'Critical',short:'CRIT',g:'▲',col:'red'},error:{label:'Error',short:'ERR',g:'◆',col:'orange'},warning:{label:'Warning',short:'WARN',g:'●',col:'amber'},info:{label:'Info',short:'INFO',g:'○',col:'blue'},debug:{label:'Debug',short:'DBG',g:'·',col:'grey'}};
const SEVMAP={debug:0,trace:0,info:1,information:1,notice:1,warn:2,warning:2,err:3,error:3,crit:4,critical:4,fatal:4};
const SEVN=['debug','info','warning','error','critical'];

const CH={phone:'Phone',sms:'SMS',email:'Email',ui:'In Herald'};

const ALIAS={type:['type','alertname','meta.schema','event_type'],severity:['severity','labels.severity','level'],timestamp:['timestamp','startsAt','meta.ts','time','ts'],service:['service','labels.service','meta.producer','workflowName','logger','host']};
const OPL={eq:'is',ne:'is not',gt:'is over',gte:'is at least',lt:'is under',lte:'is at most',in:'is one of',contains:'contains',glob:'matches (* = anything)',regex:'matches pattern',exists:'has a value',severity_gte:'is this severe or worse'};

};

const SAMPLES={

  pricing:{label:'Pricing warning',source:'logfile:pricing-engine',raw:{timestamp:'2026-10-23T09:15:40.118Z',level:'WARN',logger:'pricing-engine-3',instrument:'EURUSD',latency_ms:1840,message:'Quote latency above threshold'}},
  unseen:{label:'Batch job failed (new schema)',source:'webhook:scheduler',raw:{specversion:'1.0',id:'b7d1c2e0-41aa-4f0e-9c1d-2f6a8e7733b1',source:'/scheduler/eod',type:'com.example.batch.job.failed',time:'2026-10-23T22:05:11Z',subject:'eod-position-reconciliation',data:{jobId:'JOB-77120',attempt:3,exitCode:137,env:'prod',owner:'settlements',durationSec:5412,lastLog:'Killed: out of memory'}}}
};
const SEED_RULES=[
  {id:'r-settle',owner:'team:settlements',name:'Order settlement failures in prod',enabled:true,version:3,
   when:{all:[{field:'type',op:'eq',value:'WORKFLOW_FAILED'},{field:'workflowName',op:'eq',value:'order-settlement'},{field:'environment',op:'eq',value:'prod'}]},
   severity:'critical',present:{title:'Settlement workflow {{workflowId}} failed at {{step}}',body:'{{error.message}}',fields:['workflowId','step','error.code','error.message','environment'],highlight:['step','error.message'],colour:'red'},
   group:{by:['workflowId'],window:'5m'},notify:[{to:'oncall:settlements',channels:['phone','sms']},{to:'team:settlements',channels:['ui']}],runbook:'settlement-timeout'},
  {id:'r-pricing',owner:'team:pricing',name:'Pricing engine warnings',enabled:true,version:2,
   when:{all:[{field:'@service',op:'glob',value:'pricing-engine-*'},{field:'@severity',op:'severity_gte',value:'WARN'}]},
   severity:'event',present:{title:'{{instrument}}: {{message}}',body:'{{logger}} reported latency of {{latency_ms | number}} ms',fields:['instrument','logger','latency_ms','level'],highlight:['latency_ms'],colour:'amber'},
   group:{by:['instrument'],window:'5m'},notify:[{to:'team:pricing',channels:['ui']}],runbook:'pricing-latency'},
  {id:'r-rates',owner:'team:rates',name:'Large rejected rates trades',enabled:true,version:1,
   when:{all:[{field:'meta.schema',op:'glob',value:'trade.rejected.*'},{field:'payload.desk',op:'eq',value:'rates'},{field:'payload.notional',op:'gt',value:10000000}]},
   severity:'warning',present:{title:'Rejected {{payload.currency}} {{payload.notional}} — {{payload.reason}}',body:'Trade {{payload.tradeId}} on the {{payload.desk}} desk was rejected by {{meta.producer}}. Notional {{payload.notional | number}} {{payload.currency}}.',fields:['payload.tradeId','payload.desk','payload.notional','payload.currency','payload.reason'],highlight:['payload.reason'],colour:'amber'},
   group:{by:['payload.tradeId'],window:'1m'},notify:[{to:'team:rates',channels:['email','ui']}],runbook:null},
  {id:'r-anna',owner:'person:anna',name:'Anything critical from payments-api',enabled:true,version:1,
   when:{all:[{field:'@severity',op:'severity_gte',value:'critical'},{field:'@service',op:'eq',value:'payments-api'}]},
   resolve_when:{field:'status',op:'eq',value:'resolved'},
   severity:'critical',present:{title:'{{alertname}} on {{labels.service}} ({{labels.region}})',body:'{{annotations.summary}}',fields:['alertname','labels.service','labels.region','annotations.summary','status'],highlight:['annotations.summary'],colour:'red'},
   group:{by:['alertname','labels.service'],window:'5m'},notify:[{to:'person:anna',channels:['sms'],hours:{from:'08:00',to:'20:00',tz:'Europe/London'},else:['email']},{to:'person:anna',channels:['ui']}],runbook:'payments-high-error-rate'}
];
const RUNBOOKS={
  'settlement-timeout':{id:'settlement-timeout',title:'Settlement timeout',format:'Structured steps (YAML)',parsedBy:'parser',reviewedBy:'Marcus Lindqvist',
    source:'runbook: settlement-timeout\nmatches:\n  type: WORKFLOW_FAILED\n  "error.code": TIMEOUT\nsteps:\n  - check: "Is counterparty-service healthy?"\n    action: http_get\n    url: "http://counterparty-service/health"\n  - action: retry_workflow\n    workflowId: "{{workflowId}}"\n    approval: none\n  - if: "retry fails twice"\n    action: escalate\n    team: counterparty-support\n    approval: required',
    steps:[

      {text:'Retry workflow {{workflowId}}',kind:'action',action:'retry_workflow',params:{workflowId:'{{workflowId}}'},condition:null,approval:'none'},
      {text:'Escalate to counterparty-support',kind:'action',action:'escalate',params:{team:'counterparty-support'},condition:'retry fails twice',approval:'required',requires:{step:1,failed:2}}]},
  'payments-high-error-rate':{id:'payments-high-error-rate',title:'HighErrorRate on payments-api',format:'Markdown page',parsedBy:'parser',reviewedBy:'Leila Haddad',
    source:'# HighErrorRate on payments-api\n1. Open the payments dashboard and check if errors are in one region only.\n2. If one region: fail traffic over to the other region (needs approval from the team lead).\n3. If all regions: check the last deployment and roll it back.\n4. Post an update in the #payments-incidents channel every 15 minutes.',
    steps:[
      {text:'Open the payments dashboard and check if errors are in one region only (alert says {{labels.region}})',kind:'check',action:null,params:{},condition:null,approval:'none'},
      {text:'Fail traffic for {{labels.service}} over to the other region',kind:'action',action:'failover_traffic',params:{service:'{{labels.service}}',from:'{{labels.region}}'},condition:'errors are in one region',approval:'role:team-lead'},
      {text:'Check the last deployment of {{labels.service}} and roll it back',kind:'action',action:'rollback_deployment',params:{service:'{{labels.service}}'},condition:'errors are in all regions',approval:'required'},
      {text:'Post an update in the #payments-incidents channel every 15 minutes',kind:'manual',action:null,params:{repeat:'15m'},condition:null,approval:'none'}]},
  'pricing-latency':{id:'pricing-latency',title:'Pricing latency over a second',format:'Free text (copied from a chat message)',parsedBy:'ai',reviewedBy:null,
    source:"When pricing latency goes over a second, it's usually the cache. Restart the pricing-engine instance named in the alert, wait 2 minutes, and if latency is still high, call the pricing on-call person.",
    steps:[
      {text:'Restart {{logger}} (the instance named in the alert)',kind:'action',action:'restart_service',params:{instance:'{{logger}}'},condition:null,approval:'none'},
      {text:'Wait 2 minutes',kind:'wait',action:'wait',params:{duration:'2 minutes'},condition:null,approval:'none'},
      {text:'Call the pricing on-call person',kind:'action',action:'page_oncall',params:{team:'pricing'},condition:'latency is still high',approval:'none'}]}
};

/* ============ state ============ */
const S={team:'settlements',role:'responder',view:'feed',simOpen:false,smsDown:false,night:false,
  rules:clone(SEED_RULES),runbooks:clone(RUNBOOKS),events:[],eventsTotal:0,alerts:[],notifs:[],approvals:[],audit:[],
  threads:{},emails:[],calls:[],fields:{},toasts:[],
  f:{status:'open',sev:'all'},drawer:null,draft:null,draftNew:false,draftAI:false,edSample:null,nlText:'',
  phone:null,smsDraft:'',emailSel:null,pasteText:'',pasteSteps:null,
  ob:{src:null,t0:null,gotAt:null,eventId:null,accepted:false,alertAt:null,preMatched:false}};
let seq=0,codeSeed=3524;
const T=()=>TEAMS[S.team];
const actor=()=>S.role==='responder'?T().oncall:S.role==='lead'?T().lead:'Elena Fischer';
const canEdit=()=>S.role!=='responder';
const nextCode=()=>{codeSeed=1000+((codeSeed-1000+1297)%9000);return String(codeSeed);};
const ruleById=id=>S.rules.find(r=>r.id===id);
const alertById=id=>S.alerts.find(a=>a.id===id);

/* ============ engine: normalise, match, dedup ============ */
function flatten(o,pre,out){out=out||{};for(const k in o){const v=o[k],p=pre?pre+'.'+k:k;if(v&&typeof v==='object'&&!Array.isArray(v))flatten(v,p,out);else out[p]=v;}return out;}
function normalise(raw,source){const flat=flatten(raw);const attrs={source:source},paths={};
  for(const a in ALIAS){for(const p of ALIAS[a]){if(flat[p]!==undefined&&flat[p]!==null){attrs[a]=flat[p];paths[a]=p;break;}}}
  return {flat,attrs,paths};}
function getField(ev,f){f=String(f||'').trim();if(f.charAt(0)==='@')return ev.attrs[f.slice(1)];return ev.flat[f];}
const num=v=>(v===undefined||v===null||v==='')?NaN:Number(v);
const globRe=g=>new RegExp('^'+String(g).replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.')+'$');
const OPS={
  eq:(a,v)=>a!==undefined&&String(a)===String(v),
  ne:(a,v)=>String(a)!==String(v),
  gt:(a,v)=>num(a)>num(v), gte:(a,v)=>num(a)>=num(v), lt:(a,v)=>num(a)<num(v), lte:(a,v)=>num(a)<=num(v),
  in:(a,v)=>a!==undefined&&(Array.isArray(v)?v:list(v)).map(String).includes(String(a)),
  contains:(a,v)=>Array.isArray(a)?a.map(String).includes(String(v)):a!==undefined&&String(a).toLowerCase().includes(String(v).toLowerCase()),
  glob:(a,v)=>a!==undefined&&globRe(v).test(String(a)),
  regex:(a,v)=>{try{return a!==undefined&&new RegExp(v).test(String(a));}catch(e){return false;}},
  exists:a=>a!==undefined&&a!==null,
  severity_gte:(a,v)=>sevRank(a)>=0&&sevRank(a)>=sevRank(v)
};
const isGroup=n=>!!(n&&(n.all||n.any||n.not));
function evalNode(n,ev){
  if(n.all){const c=n.all.map(x=>evalNode(x,ev));return {kind:'all',ok:c.every(x=>x.ok),children:c};}
  if(n.any){const c=n.any.map(x=>evalNode(x,ev));return {kind:'any',ok:c.some(x=>x.ok),children:c};}
  if(n.not){const c=evalNode(n.not,ev);return {kind:'not',ok:!c.ok,children:[c]};}
  const actual=getField(ev,n.field),fn=OPS[n.op];
  return {kind:'leaf',ok:!!(fn&&fn(actual,n.value)),node:n,actual:actual};
}
function tpl(t,ev){return String(t||'').replace(/\{\{\s*([^}|]+?)\s*(?:\|\s*(\w+)\s*)?\}\}/g,(m,p,f)=>{
  const v=getField(ev,p);if(v===undefined||v===null)return '⟨missing: '+p+'⟩';
  if(f==='number'&&!isNaN(Number(v)))return nf(v);return typeof v==='object'?JSON.stringify(v):String(v);});}
function typeOf(v){if(Array.isArray(v))return 'list';if(typeof v==='number')return v>1e11?'time (epoch ms)':'number';
  if(typeof v==='boolean')return 'yes/no';if(typeof v==='string'&&/^\d{4}-\d\d-\d\dT/.test(v))return 'time (ISO)';return 'text';}
function learn(ev){for(const p in ev.flat){if(!S.fields[p])S.fields[p]={type:typeOf(ev.flat[p]),example:ev.flat[p]};}}
function withinHours(h){const now=S.night?22*60+30:10*60+15;const m=s=>{const a=String(s).split(':');return (+a[0])*60+(+a[1]||0);};
  const f=m(h.from),t=m(h.to);return f<=t?(now>=f&&now<t):(now>=f||now<t);}
function rcpt(to){const i=String(to).indexOf(':'),k=to.slice(0,i),v=to.slice(i+1),t=TEAMS[v];
  if(k==='oncall')return {person:t?t.oncall:v,label:(t?t.oncall:v)+' (on call)',isTeam:false,team:v};
  if(k==='team')return {person:t?t.oncall:v,label:(t?t.name:cap(v))+' team',isTeam:true,team:v};
  return {person:t?t.oncall:cap(v),label:t?t.oncall:cap(v),isTeam:false,team:v};}
function rcptPhrase(to){const i=String(to).indexOf(':'),k=to.slice(0,i),v=to.slice(i+1),t=TEAMS[v];
  if(k==='oncall')return 'the '+(t?t.name:cap(v))+' on-call person';if(k==='team')return 'the '+(t?t.name:cap(v))+' team';return t?t.oncall:cap(v);}
function tl(al,at,text){al.timeline.push({at:at,text:text});}
function audit(who,action,target,detail,at){const prev=S.audit[0]?S.audit[0].hash:'00000000';
  const e={at:at||Date.now(),actor:who,action:action,target:target||'',detail:detail||''};
  let h=2166136261;const s=prev+JSON.stringify(e);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  e.hash=('0000000'+(h>>>0).toString(16)).slice(-8);e.prev=prev;S.audit.unshift(e);}

function ingest(raw,source,o){o=o||{};const t=o.at||Date.now();const n=normalise(raw,source);
  const ev={id:'e'+(++seq),source:source,at:t,raw:raw,flat:n.flat,attrs:n.attrs,paths:n.paths,results:[]};
  S.eventsTotal++;learn(ev);
  if(o.store!==false){S.events.unshift(ev);if(S.events.length>60)S.events.pop();}
  for(const r of S.rules){if(!r.enabled)continue;const tr=evalNode(r.when,ev);if(!tr.ok)continue;
    const fp=r.id+'|'+((r.group&&r.group.by)||[]).map(p=>String(getField(ev,p))).join('|');
    let al=S.alerts.find(a=>a.fp===fp&&a.status!=='resolved');
    if(r.resolve_when&&evalNode(r.resolve_when,ev).ok){
      if(al){resolveAlert(al,'Herald (automatic)','the source reported the problem has cleared',t);ev.results.push({rule:r.id,alert:al.id,kind:'resolved'});}
      else ev.results.push({rule:r.id,kind:'nothing-open'});continue;}
    r.hits=(r.hits||0)+1;r.lastFired=t;
    if(al){al.count++;al.lastSeen=t;ev.results.push({rule:r.id,alert:al.id,kind:'counted'});}
    else{al=createAlert(r,ev,tr,t,fp,o);ev.results.push({rule:r.id,alert:al.id,kind:'created'});}
  }
  return ev;}
function createAlert(r,ev,tr,t,fp,o){
  const sev=r.severity==='event'?(sevName(ev.attrs.severity)||'warning'):r.severity;
  const al={id:'a'+(++seq),code:nextCode(),rule:r.id,ruleName:r.name,owner:r.owner,fp:fp,status:'firing',severity:sev,colour:r.present.colour||SEVS[sev].col,
    title:tpl(r.present.title,ev)||r.name,body:tpl(r.present.body,ev),
    fields:(r.present.fields||[]).map(p=>({path:p,value:getField(ev,p),hi:(r.present.highlight||[]).includes(p)})),
    count:1,firstSeen:t,lastSeen:t,event:ev,trace:tr,when:clone(r.when),runbook:(r.runbook&&S.runbooks[r.runbook])?r.runbook:null,run:null,timeline:[]};
  if(al.runbook)al.run=S.runbooks[al.runbook].steps.map(()=>({state:'todo',runs:0,output:[],approved:false}));
  S.alerts.unshift(al);tl(al,t,'Alert opened by the rule “'+r.name+'”');
  for(const n of (r.notify||[])){let chans=n.channels||[],note='';
    if(n.hours&&!withinHours(n.hours)){chans=n.else||[];note='outside '+n.hours.from+' to '+n.hours.to;
      tl(al,t,'Outside '+n.hours.from+' to '+n.hours.to+' for '+rcpt(n.to).label+': using '+(chans.map(c=>CH[c]).join(', ')||'no channel')+' instead');}
    const rc=rcpt(n.to);for(const ch of chans)queueNotif(al,rc,ch,t,o,note);}
  return al;}
const SEED_LAT={ui:14,email:238,sms:412,phone:655};
function queueNotif(al,rc,ch,t,o,note){
  const to=ch==='ui'?(rc.isTeam?rc.label:rc.person):(ch==='email'&&rc.isTeam?rc.label+' mailbox':rc.person);
  const n={id:'n'+(++seq),alert:al.id,to:to,channel:ch,status:'pending',attempts:0,at:t,latency:null,note:note||'',timer:null};
  S.notifs.unshift(n);
  if(o&&o.seed){n.attempts=1;deliver(n,SEED_LAT[ch],true);return;}
  const d={ui:12+Math.random()*14,email:150+Math.random()*170,sms:250+Math.random()*230,phone:500+Math.random()*300}[ch];
  n.timer=setTimeout(()=>{attempt(n);render();},d);}
function attempt(n){n.timer=null;n.attempts++;
  if(n.channel==='sms'&&S.smsDown){const al=alertById(n.alert);
    if(n.attempts>=5){n.status='parked';if(!n.fallback){n.fallback=true;tl(al,Date.now(),'SMS to '+n.to+' failed 5 times. Kept in the queue and sent by email as well');
      queueNotif(al,{person:n.to,label:n.to,isTeam:false},'email',Date.now(),null,'fallback for SMS');}return;}
    n.status='retrying';const wait=1500*Math.pow(2,n.attempts-1);n.nextIn=wait;
    if(n.attempts===1)tl(al,Date.now(),'SMS to '+n.to+' failed: gateway not responding. Retrying with growing pauses');
    n.timer=setTimeout(()=>{attempt(n);render();},wait);return;}
  deliver(n);}
function deliver(n,lat,seed){n.status='delivered';n.latency=lat!=null?lat:Math.max(1,Date.now()-n.at);const at=n.at+n.latency;const al=alertById(n.alert);
  if(n.channel==='sms')pushSms(n.to,'in',smsText(al),at);
  if(n.channel==='email'){const m={id:'m'+(++seq),to:n.to,alert:al.id,at:at};S.emails.unshift(m);}
  if(n.channel==='phone')S.calls.unshift({id:'c'+(++seq),to:n.to,alert:al.id,state:seed?'missed':'ringing',at:at});
  tl(al,at,CH[n.channel]+(n.channel==='ui'?' feed updated for ':' delivered to ')+n.to+(n.attempts>1?' on attempt '+n.attempts:''));}
function smsBack(){S.notifs.forEach(n=>{if(n.channel==='sms'&&(n.status==='retrying'||n.status==='parked')){if(n.timer)clearTimeout(n.timer);n.timer=null;n.attempts++;deliver(n);}});}
function pushSms(person,dir,text,at){(S.threads[person]=S.threads[person]||[]).push({dir:dir,text:text,at:at||Date.now()});}
function smsText(al){const tail=' Reply ACK '+al.code+' to acknowledge. hrld.example/a/'+al.code;const head='['+SEVS[al.severity].short+'] ';
  const room=160-head.length-tail.length;let t=al.title;if(t.length>room)t=t.slice(0,room-1)+'…';return head+t+tail;}
function voiceText(al,to){return 'This is Herald calling '+to+'. '+SEVS[al.severity].label+' alert. '+al.title+'. Press 1 to acknowledge. Press 2 to pass it to the team lead.';}

/* ============ alert and runbook operations ============ */
function ackAlert(al,who,via){if(al.status!=='firing')return false;al.status='acked';al.ackedBy=who;
  tl(al,Date.now(),'Acknowledged by '+who+' ('+via+')');audit(who,'Acknowledged alert',al.title,via);
  S.calls.forEach(c=>{if(c.alert===al.id&&c.state==='ringing'){c.state='ended';c.note='Acknowledged elsewhere';}});return true;}
function resolveAlert(al,who,why,at){if(al.status==='resolved')return false;al.status='resolved';al.resolvedBy=who;
  tl(al,at||Date.now(),'Resolved by '+who+(why?': '+why:''));audit(who,'Resolved alert',al.title,why||'',at);
  S.calls.forEach(c=>{if(c.alert===al.id&&c.state==='ringing'){c.state='ended';c.note='Alert resolved';}});return true;}
const needsApproval=st=>st.approval&&st.approval!=='none';
function stepLock(al,rb,i){const st=rb.steps[i];if(!st.requires)return null;const rs=al.run[st.requires.step];
  const fails=rs.output.filter(x=>!x.ok).length;if(rs.state==='done')return {text:'Not needed: step '+(st.requires.step+1)+' worked.'};
  if(fails<st.requires.failed)return {text:'Unlocks when: '+st.condition+' ('+fails+' of '+st.requires.failed+' so far).'};return null;}
const ACTIONS={
  http_get:(al,p)=>({ok:true,text:'GET '+p.url+' → 503 Service Unavailable in 212 ms. 1 of 2 instances is unhealthy.'}),
  retry_workflow:(al,p,rs)=>rs.runs<2?{ok:false,text:'Retry '+(rs.runs+1)+' of '+p.workflowId+' failed again: TIMEOUT at validate-counterparty.'}:{ok:true,resolve:'the workflow completed after a retry',text:'Retry '+(rs.runs+1)+' of '+p.workflowId+' completed. Settlement confirmed.'},
  escalate:(al,p)=>({ok:true,text:'Escalated to '+p.team+'. Ticket CPS-4471 opened and their on-call person paged.'}),
  failover_traffic:(al,p)=>({ok:true,text:'Traffic for '+p.service+' moved from '+p.from+' to eu-central. Error rate is now 0.4%.'}),
  rollback_deployment:(al,p)=>({ok:true,text:'Rolled '+p.service+' back from v2.41.0 to v2.40.3.'}),
  restart_service:(al,p)=>({ok:true,text:'Restarted '+p.instance+'. Cache warm again after 38 s.'}),
  page_oncall:(al,p)=>({ok:true,text:'Phoned '+(TEAMS[p.team]?TEAMS[p.team].oncall:p.team)+', who is on call for '+cap(p.team)+'.'})
};
function stepParams(al,st){const p={};for(const k in (st.params||{}))p[k]=tpl(st.params[k],al.event);return p;}
function runStep(al,i){const rb=S.runbooks[al.runbook],st=rb.steps[i],rs=al.run[i],who=actor();
  if(stepLock(al,rb,i)||rs.state==='running'||rs.state==='awaiting')return;
  const title=tpl(st.text,al.event);
  if(!st.action){rs.state='done';rs.runs++;rs.output.push({at:Date.now(),ok:true,by:who,text:'Marked done by '+who+'.'});
    tl(al,Date.now(),'Step '+(i+1)+' marked done by '+who);audit(who,'Completed runbook step',title,al.title);return;}
  if(needsApproval(st)){const lead=TEAMS[teamKey(al.owner)].lead;
    const ap={id:'p'+(++seq),code:nextCode(),alert:al.id,step:i,title:title,requestedBy:who,approver:lead,status:'pending',at:Date.now()};
    S.approvals.unshift(ap);rs.state='awaiting';
    pushSms(lead,'in','Herald approval needed: “'+title+'”, asked by '+who+'. Reply YES '+ap.code+' to approve or NO '+ap.code+' to reject.');
    tl(al,Date.now(),who+' asked to run step '+(i+1)+'. Waiting for approval from '+lead);
    audit(who,'Asked for approval',title,'approver '+lead);return;}
  execStep(al,i,who);}
function execStep(al,i,who){const rb=S.runbooks[al.runbook],st=rb.steps[i],rs=al.run[i];rs.state='running';
  setTimeout(()=>{const p=stepParams(al,st);
    const res=st.kind==='wait'?{ok:true,text:'Waited '+p.duration+' (shortened to 5 seconds in this prototype).'}:(ACTIONS[st.action]?ACTIONS[st.action](al,p,rs):{ok:true,text:'Done.'});
    rs.runs++;rs.output.push({at:Date.now(),ok:res.ok,by:who,text:res.text});rs.state=res.ok?'done':'failed';
    tl(al,Date.now(),'Step '+(i+1)+(res.ok?' done':' failed')+': '+res.text);
    audit(who,res.ok?'Ran runbook step':'Ran runbook step (failed)',tpl(st.text,al.event),al.title);
    if(res.resolve)resolveAlert(al,'Herald (automatic)',res.resolve);
    render();},st.kind==='wait'?5000:900);}
function approvalBlock(ap,person,viaUi){
  if(viaUi&&S.role!=='lead')return 'Only a team lead can approve this step.';
  if(person===ap.requestedBy)return 'You asked for this step, so someone else has to approve it.';
  if(person!==ap.approver)return 'Only a team lead can approve this step.';return null;}
function decide(ap,yes,who,via){const al=alertById(ap.alert),rs=al.run[ap.step];ap.status=yes?'approved':'rejected';ap.by=who;
  if(yes){tl(al,Date.now(),'Step '+(ap.step+1)+' approved by '+who+' ('+via+')');audit(who,'Approved runbook step',ap.title,via+', asked by '+ap.requestedBy);execStep(al,ap.step,ap.requestedBy);}
  else{rs.state='todo';rs.output.push({at:Date.now(),ok:false,by:who,text:'Approval rejected by '+who+'. Nothing was run.'});
    tl(al,Date.now(),'Step '+(ap.step+1)+' rejected by '+who+' ('+via+')');audit(who,'Rejected runbook step',ap.title,via);}}
function smsReply(person,text){pushSms(person,'out',text);const re=t=>pushSms(person,'in',t);
  const m=text.trim().match(/^(ACK|RES|RESOLVE|YES|NO)\s+(\d{4})$/i);
  if(!m){re('Not understood. Reply ACK, RESOLVE, YES or NO followed by the 4-digit code.');return;}
  const cmd=m[1].toUpperCase(),code=m[2];
  if(cmd==='YES'||cmd==='NO'){const ap=S.approvals.find(a=>a.code===code);
    if(!ap)return re('There is no approval request with code '+code+'.');
    if(ap.status!=='pending')return re('That request was already '+ap.status+'.');
    const b=approvalBlock(ap,person,false);if(b)return re(b);
    decide(ap,cmd==='YES',person,'SMS reply');re(cmd==='YES'?'Approved. Running “'+ap.title+'” now.':'Rejected. Nothing was run.');return;}
  const al=S.alerts.find(a=>a.code===code);if(!al)return re('There is no alert with code '+code+'.');
  if(cmd==='ACK'){re(ackAlert(al,person,'SMS reply')?'Acknowledged: '+al.title:'That alert is already '+(al.status==='acked'?'acknowledged':'resolved')+'.');}
  else re(resolveAlert(al,person,'by SMS reply')?'Resolved: '+al.title:'That alert is already resolved.');}

/* ============ plain language ============ */
function flabel(f){f=String(f||'');if(f.charAt(0)==='@')return {'@severity':'severity','@service':'service','@type':'event type','@source':'source','@timestamp':'time'}[f]||f.slice(1);
  let s=f.split('.');while(s.length>1&&['payload','data','labels','meta','annotations'].includes(s[0]))s.shift();
  return s.join(' ').replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').toLowerCase()||'(no field)';}
function vfmt(v){if(Array.isArray(v))return joinAnd(v.map(String),'or');if(typeof v==='number')return nf(v);return String(v==null?'':v);}
function leafPhrase(n){const l=flabel(n.field);switch(n.op){
  case 'exists':return l+' has a value';
  case 'severity_gte':return l+' is '+(sevName(n.value)||vfmt(n.value))+' or worse';
  case 'glob':return l+' matches '+vfmt(n.value);
  case 'regex':return l+' matches the pattern '+vfmt(n.value);
  default:return l+' '+(OPL[n.op]||n.op)+' '+vfmt(n.value);}}
function condPhrase(n,top){
  if(n.all||n.any){const k=n.all||n.any;if(!k.length)return '';const s=joinAnd(k.map(x=>condPhrase(x,false)).filter(Boolean),n.all?'and':'or');return top||k.length<2?s:'('+s+')';}
  if(n.not){const k=n.not.any||[n.not];return 'none of these is true: '+k.map(x=>condPhrase(x,false)).join('; ');}
  return leafPhrase(n);}
function notifyPhrase(n){const who=rcptPhrase(n.to),v={phone:'call',sms:'text',email:'email'};
  const part=ch=>{const a=ch.filter(c=>c!=='ui').map(c=>v[c]);let s=a.length?joinAnd(a)+' '+who:'';if(ch.includes('ui'))s+=(s?' and ':'')+'show it to '+who+' in Herald';return s;};
  let s=part(n.channels||[]);if(!s)return '';
  if(n.hours)s+=' between '+n.hours.from+' and '+n.hours.to+((n.else&&n.else.length)?' (outside those hours, '+part(n.else)+')':' (outside those hours, do nothing)');return s;}
function ruleSentence(r){const c=condPhrase(r.when,true);const acts=(r.notify||[]).map(notifyPhrase).filter(Boolean);
  let s=(c?'When '+c:'For every event that arrives')+', '+(acts.length?joinAnd(acts):'tell nobody yet')+'.';
  if(r.group&&r.group.by&&r.group.by.length)s+=' Repeats with the same '+joinAnd(r.group.by.map(flabel))+' are counted on one alert ('+r.group.window+' window).';return s;}
function needText(n){switch(n.op){case 'eq':return 'needs to be '+vfmt(n.value);case 'ne':return 'must not be '+vfmt(n.value);case 'gt':return 'needs to be over '+vfmt(n.value);
  case 'gte':return 'needs at least '+vfmt(n.value);case 'lt':return 'needs to be under '+vfmt(n.value);case 'lte':return 'needs at most '+vfmt(n.value);
  case 'in':return 'needs to be one of '+vfmt(n.value);case 'contains':return 'needs to contain '+vfmt(n.value);case 'glob':case 'regex':return 'needs to match '+vfmt(n.value);
  case 'exists':return 'needs a value';case 'severity_gte':return 'needs '+(sevName(n.value)||n.value)+' or worse';}return '';}
function firstFail(tr){if(tr.ok)return null;
  if(tr.kind==='leaf')return flabel(tr.node.field)+' is '+(tr.actual===undefined?'missing':vfmt(tr.actual))+', '+needText(tr.node);
  if(tr.kind==='not')return 'an excluded condition is true';
  if(tr.kind==='any')return tr.children.length?'none of the alternatives matched (first: '+firstFail(tr.children[0])+')':'no conditions in the group';
  for(const c of tr.children){const f=firstFail(c);if(f)return f;}return 'did not match';}
function evLabel(ev){const t=ev.attrs.type||'(no type found)';const s=ev.attrs.service;return t+(s?' · '+s:'');}

/* ============ simulate ============ */
function toast(text,btn){const id=++seq;S.toasts.push({id:id,text:text,btn:btn});if(S.toasts.length>3)S.toasts.shift();
  setTimeout(()=>{S.toasts=S.toasts.filter(x=>x.id!==id);renderToasts();},8000);}
function announce(ev,label){const r=ev.results[0];
  if(!r){toast(label+': no rule matched, so nobody was disturbed.',ev.attrs.type&&String(ev.attrs.type).indexOf('batch')>=0?{label:'Build a rule from it',act:'ruleFromEvent',id:ev.id}:{label:'Why?',act:'openEvent',id:ev.id});return;}
  const al=r.alert&&alertById(r.alert),own=al?TEAMS[teamKey(al.owner)].name:'';
  const more=ev.results.length>1?' (+'+(ev.results.length-1)+' more rule'+(ev.results.length>2?'s':'')+')':'';
  if(r.kind==='created')toast(label+': opened an alert for '+own+more+'.',{label:'View',act:'gotoAlert',id:al.id});
  else if(r.kind==='counted')toast(label+': counted on the open alert (×'+nf(al.count)+'). Nobody was notified again.',{label:'View',act:'gotoAlert',id:al.id});
  else if(r.kind==='resolved')toast(label+': closed “'+al.title+'” automatically.',{label:'View',act:'gotoAlert',id:al.id});
  else toast(label+': the problem has cleared, and there was no open alert to close.');}
function sim(k){let s,raw,label;
  if(k==='burst')return burst();
  if(k==='resolved'){s=SAMPLES.metric;raw=clone(s.raw);raw.status='resolved';raw.endsAt=new Date().toISOString();label='Metric back to normal';}
  else if(k==='tradeSmall'){s=SAMPLES.trade;raw=clone(s.raw);raw.payload.notional=2000000;raw.payload.tradeId='T-998912';label='Trade rejected, 2,000,000 EUR';}
  else{s=SAMPLES[k];raw=clone(s.raw);label=s.label;}
  const ev=ingest(raw,s.source);announce(ev,label);return ev;}
function burst(){const total=500,t0=Date.now();let sent=0,first=null;
  const step=()=>{for(let i=0;i<50;i++){const raw=clone(SAMPLES.pricing.raw);raw.latency_ms=1200+((sent*37)%900);
      const ev=ingest(raw,SAMPLES.pricing.source,{store:sent===0});if(!first)first=ev;sent++;}
    first.burstN=sent;render();
    if(sent<total)setTimeout(step,70);
    else{const r=first.results[0],al=r&&r.alert&&alertById(r.alert);
      if(al)toast('500 pricing warnings in '+((Date.now()-t0)/1000).toFixed(1)+' s became one alert showing ×'+nf(al.count)+'.',{label:'View',act:'gotoAlert',id:al.id});
      else toast('500 pricing warnings received. No enabled rule matched them.',{label:'Why?',act:'openEvent',id:first.id});
      render();}};
  step();}

function normDraft(r){const fix=n=>{if(n.not){if(!n.not.any)n.not={any:[n.not]};n.not.any.forEach(fix);}else if(n.all)n.all.forEach(fix);else if(n.any)n.any.forEach(fix);};
  if(!isGroup(r.when))r.when={all:[r.when]};fix(r.when);r.present=r.present||{};r.present.fields=r.present.fields||[];r.present.highlight=r.present.highlight||[];
  r.group=r.group||{by:[],window:'5m'};r.notify=r.notify||[];return r;}
const kids=n=>n.all||n.any||n.not.any;
function nodeAt(path){let n=S.draft.when;if(path==='')return n;for(const i of String(path).split('.'))n=kids(n)[+i];return n;}
function parentOf(path){const p=String(path).split('.');const idx=+p.pop();return {parent:nodeAt(p.join('.')),idx:idx};}
function startEdit(draft,isNew,ai,sampleId){S.draft=normDraft(draft);S.draftNew=isNew;S.draftAI=!!ai;
  const hit=S.events.find(e=>evalNode(S.draft.when,e).ok&&kids(S.draft.when).length);
  S.edSample=sampleId||(hit?hit.id:(S.events[0]?S.events[0].id:null));S.view='rules';S.drawer=null;}

/* ============ runbook paste parser ============ */
function parseRunbook(text){const lines=String(text).split(/\n+/).map(l=>l.trim()).filter(Boolean);
  let parts=lines.filter(l=>/^(\d+[.)]|[-*•]|\[[ x]\])\s+/i.test(l)).map(l=>l.replace(/^(\d+[.)]|[-*•]|\[[ x]\])\s+/i,''));
  if(!parts.length)parts=String(text).replace(/\n+/g,' ').split(/(?<=[.!?])\s+|,\s+(?:and\s+)?(?=(?:then\s+)?(?:if|wait|restart|retry|call|check|open|post|roll|escalate|fail|page|verify)\b)/i).map(s=>s.trim().replace(/^(and|then)\s+/i,'')).filter(s=>s.length>2);
  for(let i=0;i<parts.length-1;i++){if(/^if\b/i.test(parts[i])&&!/[:,]/.test(parts[i])){parts[i]=parts[i]+', '+parts[i+1];parts.splice(i+1,1);}}
  return parts.map(p=>{let condition=null;let t=p;const m=t.match(/^if\s+(.+?)(?::|,)\s*(.+)$/i);if(m){condition=m[1];t=m[2];}
    let approval='none';if(/approv/i.test(p))approval=/team lead/i.test(p)?'role:team-lead':'required';
    let kind='manual',action=null;
    if(/\bwait\b/i.test(t)){kind='wait';action='wait';}
    else if(/\brestart\b/i.test(t)){kind='action';action='restart_service';}
    else if(/\bretry\b/i.test(t)){kind='action';action='retry_workflow';}
    else if(/roll\s*(it\s*)?back/i.test(t)){kind='action';action='rollback_deployment';}
    else if(/fail\s*(traffic\s*)?over/i.test(t)){kind='action';action='failover_traffic';}
    else if(/\b(escalate|call|page)\b/i.test(t)){kind='action';action=/escalate/i.test(t)?'escalate':'page_oncall';}
    else if(/\b(check|verify|confirm)\b|\?$/i.test(t)){kind='check';}
    return {text:cap(t.replace(/\.$/,'')),kind:kind,action:action,params:{},condition:condition,approval:approval};});}

/* ============ view pieces ============ */
const sevTag=s=>`<span class="sev sev-${s}"><span aria-hidden="true">${SEVS[s].g}</span>${SEVS[s].label}</span>`;
const statusText=a=>a.status==='firing'?'Needs attention':a.status==='acked'?'Acknowledged by '+a.ackedBy:'Resolved';
function chipHtml(n){let s=n.status,t;
  if(s==='delivered')t=n.channel==='ui'?'shown':'delivered';else if(s==='retrying')t='retrying '+n.attempts+'/5';else if(s==='parked')t='held, gateway down';else t='sending';
  return `<span class="chip ${s}">${CH[n.channel]} · ${esc(n.to)} · ${t}</span>`;}
function alertRow(a){const ns=S.notifs.filter(n=>n.alert===a.id).slice().reverse();
  return `<article class="alert st-${a.status} c-${a.colour}" data-act="openAlert" data-id="${a.id}" tabindex="0" aria-label="Open alert: ${esc(a.title)}">

    <div class="al-main">
      <div class="row">${sevTag(a.severity)}${a.count>1?`<span class="count" title="Seen ${nf(a.count)} times">×${nf(a.count)}</span>`:''}<span class="pill ${a.status}">${esc(statusText(a))}</span></div>
      <h3>${esc(a.title)}</h3>

function evResult(ev){if(!ev.results.length)return '<span class="muted">No rule matched</span>';
  return ev.results.map(r=>{const al=r.alert&&alertById(r.alert);const rn=(ruleById(r.rule)||{}).name||'rule';
    return r.kind==='created'?'Opened alert':r.kind==='counted'?'Counted on open alert'+(al?' (×'+nf(al.count)+')':''):r.kind==='resolved'?'Closed alert':'Cleared, nothing open';}).join(' · ');}
function viewFeed(){const t=T(),mine=S.alerts.filter(a=>a.owner===t.owner),f=S.f;
  const shown=mine.filter(a=>(f.status==='all'||(f.status==='open'?a.status!=='resolved':a.status===f.status))&&(f.sev==='all'||a.severity===f.sev));
  const openN=mine.filter(a=>a.status!=='resolved').length;
  const seg=(key,lab,opts)=>`<div class="seg" role="group" aria-label="${lab}">${opts.map(o=>`<button class="segb" data-act="filter" data-k="${key}" data-v="${o[0]}" aria-pressed="${f[key]===o[0]}">${o[1]}</button>`).join('')}</div>`;
  let body;
  if(!mine.length)body=`<div class="empty"><h2>No alerts for ${esc(t.name)} yet</h2><p class="muted">Alerts appear here the moment a rule matches an event. No refresh needed.</p><button class="btn pri" data-act="testEvent">Send a test event</button></div>`;
  else if(!shown.length)body=`<div class="empty"><h2>Nothing matches these filters</h2><p class="muted">${openN?openN+' alert'+(openN>1?'s are':' is')+' open under other filters.':'Everything for '+esc(t.name)+' is resolved.'}</p><div class="row"><button class="btn" data-act="filterReset">Show all alerts</button><button class="btn" data-act="testEvent">Send a test event</button></div></div>`;
  else body=`<div class="stack">${shown.map(alertRow).join('')}</div>`;
  const evs=S.events.slice(0,8);
  return `<div class="row"><div class="grow"><h1>Live feed</h1><p class="muted">${esc(t.name)} · ${openN} open · on call now: ${esc(t.oncall)}</p></div>
      <span class="live"><span class="dot pulse"></span>Live, updates pushed as they happen</span></div>
    <div class="row">${seg('status','Filter by status',[['open','Open'],['firing','Needs attention'],['acked','Acknowledged'],['resolved','Resolved'],['all','All']])}
      ${seg('sev','Filter by severity',[['all','Any severity'],['critical','Critical'],['error','Error'],['warning','Warning'],['info','Info']])}</div>
    ${body}
    <section class="card"><div class="row"><h2 class="grow">Events received</h2><span class="note num">${nf(S.eventsTotal)} in total, all sources and teams</span></div>
      <div>${evs.map(e=>`<div class="evrow"><span class="note num">${clock(e.at)}</span>
        <div style="min-width:0"><div style="overflow-wrap:anywhere"><b>${esc(evLabel(e))}</b>${e.burstN?` <span class="count">×${nf(e.burstN)} burst</span>`:''}</div><div class="note">${esc(e.source)} · ${evResult(e)}</div></div>
        <button class="btn sm" data-act="openEvent" data-id="${e.id}">${e.results.length?'Details':'Why not?'}</button></div>`).join('')||'<p class="muted">No events yet.</p>'}</div></section>`;}

/* ---- drawer ---- */
function traceHtml(tr){if(tr.kind==='leaf'){const n=tr.node;
    return `<li><span class="tick ${tr.ok?'y':'n'}" aria-label="${tr.ok?'matched':'did not match'}">${tr.ok?'✓':'✗'}</span><span><code>${esc(n.field)}</code> ${esc(OPL[n.op]||n.op)} ${n.op==='exists'?'':`<b>${esc(vfmt(n.value))}</b>`}</span><span class="muted">event has ${tr.actual===undefined?'no such field':`<code>${esc(vfmt(tr.actual))}</code>`}</span></li>`;}
  const lab={all:'All of these',any:'Any of these',not:'None of these'}[tr.kind];
  return `<li><span class="tick ${tr.ok?'y':'n'}">${tr.ok?'✓':'✗'}</span><span>${lab}</span></li><ul>${tr.children.map(traceHtml).join('')}</ul>`;}
function varHi(text){return esc(text).replace(/\{\{[^}]+\}\}/g,m=>`<span class="var">${m}</span>`);}
function approvalBadge(st){return !needsApproval(st)?'':`<span class="badge ap">${st.approval==='role:team-lead'?'Requires approval from the team lead':'Requires approval'}</span>`;}
function runStepHtml(a,rb,i){const st=rb.steps[i],rs=a.run[i],lock=stepLock(a,rb,i);
  const ap=S.approvals.find(x=>x.alert===a.id&&x.step===i&&x.status==='pending');
  const stateLab={todo:'To do',running:st.kind==='wait'?'Waiting…':'Running…',awaiting:'Awaiting approval',done:'Done',failed:'Failed'}[rs.state];
  const p=stepParams(a,st);const ps=Object.keys(p).map(k=>k+'='+p[k]).join(', ');
  let ctl='';
  if(rs.state==='awaiting'&&ap){const blk=approvalBlock(ap,actor(),true);
    ctl=`<div class="banner"><div>Waiting for approval from <b>${esc(ap.approver)}</b> (team lead). Asked by ${esc(ap.requestedBy)} at ${clock(ap.at)}.</div>
      <div class="row" style="margin-top:6px"><button class="btn sm pri" data-act="approve" data-id="${ap.id}" ${blk?'disabled':''}>Approve</button><button class="btn sm warn" data-act="reject" data-id="${ap.id}" ${blk&&actor()!==ap.requestedBy?'disabled':''}>${actor()===ap.requestedBy?'Cancel request':'Reject'}</button></div>
      ${blk?`<div class="note" style="margin-top:6px">${esc(blk)} ${S.role!=='lead'?'Switch “Signed in as” to Team lead to try it.':''}</div>`:''}
      <div class="note" style="margin-top:6px">Or reply <code>YES ${ap.code}</code> by SMS from ${esc(ap.approver)}’s phone. <button class="btn link" data-act="openPhone" data-who="${esc(ap.approver)}">Open the phone</button></div></div>`;}
  else if(lock)ctl=`<div class="note">${esc(lock.text)}</div>`;
  else if(rs.state==='todo'||rs.state==='failed'){const lab=!st.action?'Mark done':st.kind==='wait'?'Start timer':rs.state==='failed'?'Run again':needsApproval(st)?'Ask to run':'Run';
    ctl=`<div class="row"><button class="btn sm ${rs.state==='failed'?'':'pri'}" data-act="runStep" data-id="${a.id}" data-i="${i}">${lab}</button>${needsApproval(st)?'<span class="note">Runs only after approval.</span>':''}</div>`;}
  return `<li class="step"><div class="sn ${rs.state}" aria-hidden="true">${rs.state==='done'?'✓':rs.state==='failed'?'!':i+1}</div>
    <div class="sb"><div class="row"><b style="overflow-wrap:anywhere">${esc(tpl(st.text,a.event))}</b></div>
      <div class="row"><span class="badge">${stateLab}</span><span class="badge">${{check:'Check',action:'Action',manual:'By hand',wait:'Wait'}[st.kind]}</span>${approvalBadge(st)}</div>
      ${st.condition?`<div class="note">Only if: ${esc(st.condition)}</div>`:''}
      ${st.action&&st.kind!=='wait'?`<div class="note mono" style="overflow-wrap:anywhere">${esc(st.action)}(${esc(ps)})</div>`:''}
      ${rs.output.map(o=>`<div class="out ${o.ok?'':'bad'}"><span class="num">${clock(o.at)}</span> ${esc(o.text)}</div>`).join('')}
      ${ctl}</div></li>`;}
function drawerAlert(a){const rb=a.runbook&&S.runbooks[a.runbook];const ns=S.notifs.filter(n=>n.alert===a.id).slice().reverse();
  $('drawerHead').innerHTML=`<div class="row"><div class="row grow">${sevTag(a.severity)}${a.count>1?`<span class="count">×${nf(a.count)}</span>`:''}<span class="pill ${a.status}">${esc(statusText(a))}</span></div><button class="btn sm" id="drClose" data-act="closeDrawer">Close</button></div>

    <section class="sec">${a.body?`<p style="overflow-wrap:anywhere">${esc(a.body)}</p>`:''}
      <dl class="kv">${a.fields.map(f=>`<dt><code>${esc(f.path)}</code></dt><dd class="${f.hi?'hi':''}">${f.value===undefined?'<span class="muted">⟨missing⟩</span>':esc(vfmt(f.value))}</dd>`).join('')}
        <dt>Seen</dt><dd class="num">${nf(a.count)} time${a.count>1?'s':''}, first ${clock(a.firstSeen)}, last ${clock(a.lastSeen)}</dd>
        <dt>Rule</dt><dd>${esc(a.ruleName)} · ${esc(TEAMS[teamKey(a.owner)].name)}</dd><dt>Reply code</dt><dd class="mono">${a.code}</dd></dl></section>
    <section class="sec"><div class="row"><h2 class="grow">What to do next</h2>${rb?`<span class="badge">Runbook: ${esc(rb.title)}</span>`:''}</div>
      ${rb?`${rb.parsedBy==='ai'&&!rb.reviewedBy?'<div class="banner info">These steps were drafted by AI from free text and have not been reviewed yet.</div>':''}<p class="note">Values in the steps are filled in from this event.</p><ol>${rb.steps.map((s,i)=>runStepHtml(a,rb,i)).join('')}</ol>`
          :'<p class="muted">No runbook is attached to this rule. Add one in the rule editor under “Then”.</p>'}</section>
    <section class="sec"><h2>Who was told</h2><div class="chips">${ns.map(chipHtml).join('')||'<span class="muted">Nobody.</span>'}</div></section>
    <section class="sec"><h2>Why did this match?</h2><ul class="why">${traceHtml(a.trace)}</ul></section>
    <section class="sec"><h2>Timeline</h2><ul class="tl">${a.timeline.slice().sort((x,y)=>x.at-y.at).map(t=>`<li><span class="note num">${clock(t.at)}</span><span style="overflow-wrap:anywhere">${esc(t.text)}</span></li>`).join('')}</ul></section>
    <section class="sec"><h2>Original event</h2><p class="note">From ${esc(a.event.source)}, exactly as received.</p><pre>${esc(JSON.stringify(a.event.raw,null,2))}</pre></section>`;}
function drawerEvent(ev){

function groupHtml(node,path){const mode=node.all?'all':node.any?'any':'none';const ks=kids(node);const pid=path===''?'root':path;
  return `<div class="grp"><div class="row"><label class="row" for="gm-${pid}" style="gap:6px">Match <select class="in" id="gm-${pid}" data-onc="grpMode" data-path="${path}">${opt('all','all of these',mode)}${opt('any','any of these',mode)}${opt('none','none of these',mode)}</select></label>
      ${path!==''?`<button class="btn sm" data-act="delCond" data-path="${path}" style="margin-left:auto">Remove group</button>`:''}</div>
    ${ks.map((k,i)=>{const p=path===''?String(i):path+'.'+i;return isGroup(k)?groupHtml(k,p):condHtml(k,p);}).join('')}
    ${ks.length?'':'<p class="note">No conditions yet. Add one, or click a field in the sample event.</p>'}
    <div class="row"><button class="btn sm" data-act="addCond" data-path="${path}">Add condition</button>${path===''?`<button class="btn sm" data-act="addGroup" data-path="${path}">Add group</button>`:''}</div></div>`;}
function condHtml(n,p){return `<div class="cond"><input class="in mono" id="cf-${p}" list="fieldList" data-oni="condField" data-path="${p}" value="${esc(n.field)}" placeholder="field, e.g. payload.notional" aria-label="Field">

    <input class="in" id="cv-${p}" data-oni="condVal" data-path="${p}" value="${esc(Array.isArray(n.value)?n.value.join(', '):n.value==null?'':n.value)}" placeholder="${n.op==='in'?'values, separated by commas':'value'}" aria-label="Value" ${n.op==='exists'?'hidden':''}>
    <button class="x" data-act="delCond" data-path="${p}" aria-label="Remove condition">×</button></div>`;}
function rcptOptions(cur){let h='';for(const k in TEAMS){const t=TEAMS[k];if(t.personal)h+=opt(t.owner,t.oncall,cur);else h+=opt('oncall:'+k,t.name+' on-call person (now '+t.oncall+')',cur)+opt('team:'+k,t.name+' team',cur);}return h;}
function chBoxes(i,key,sel){return CHS.map(c=>`<label class="chk"><input type="checkbox" id="nt-${key}-${i}-${c}" data-onc="${key==='ch'?'ntCh':'ntElse'}" data-i="${i}" data-ch="${c}" ${sel.includes(c)?'checked':''}> ${CH[c]}</label>`).join('');}

function jsonPick(o,pre,ind){const sp='  '.repeat(ind+1);return '{\n'+Object.keys(o).map(k=>{const p=pre?pre+'.'+k:k,v=o[k];

function editorSide(){const d=S.draft;const evs=S.events.slice(0,50);const res=evs.map(e=>({e:e,tr:evalNode(d.when,e)}));const n=res.filter(x=>x.tr.ok).length;

function phonePeople(){const s=new Set([T().oncall,T().lead]);Object.keys(S.threads).forEach(k=>s.add(k));S.calls.forEach(c=>s.add(c.to));return [...s];}
function viewDeliveries(){const people=phonePeople();if(!people.includes(S.phone))S.phone=people[0];const me=S.phone;
  const th=S.threads[me]||[];const calls=S.calls.filter(c=>c.to===me);const ring=calls.find(c=>c.state==='ringing');
  const codes=[...new Set((th.filter(m=>m.dir==='in').slice(-3).map(m=>m.text).join(' ').match(/\b(?:ACK|YES)\s\d{4}\b/g)||[]))].slice(-2);
  const sel=S.emails.find(m=>m.id===S.emailSel)||S.emails[0];const waiting=S.notifs.filter(n=>n.status==='retrying'||n.status==='parked').length;

    ${S.smsDown?`<div class="banner"><b>SMS gateway is down.</b> ${waiting} message${waiting===1?' is':'s are'} waiting and will be sent when it returns. Nothing is dropped. <button class="btn link" data-act="smsToggle">Bring it back</button></div>`:''}

        <div class="ptabs" role="group" aria-label="Whose phone">${people.map(p=>`<button class="ptab" data-act="phoneTab" data-who="${esc(p)}" aria-pressed="${p===me}">${esc(p)}</button>`).join('')}</div>
        <div class="phone"><div class="row"><b class="grow">${esc(me)}</b><span class="note">Messages from Herald</span></div>
          ${ring?(()=>{const a=alertById(ring.alert);return `<div class="call"><div class="row"><span class="live"><span class="dot pulse"></span>Incoming call from Herald</span></div><p style="overflow-wrap:anywhere">“${esc(voiceText(a,me))}”</p>
            <div class="keys">${['1','2','3','4','5','6','7','8','9','*','0','#'].map(d=>`<button class="key ${d==='1'||d==='2'?'act':''}" data-act="key" data-id="${ring.id}" data-d="${d}"><b>${d}</b><small>${d==='1'?'acknowledge':d==='2'?'team lead':''}</small></button>`).join('')}</div>
            <button class="btn sm warn" data-act="key" data-id="${ring.id}" data-d="x">Hang up</button></div>`;})():''}
          <div class="thread" id="thread">${calls.filter(c=>c.state!=='ringing').slice().reverse().map(c=>`<div class="bub in"><i>${c.state==='missed'?'Call from Herald, not answered':'Call from Herald ended'}${c.note?': '+esc(c.note):''}</i><small class="num">${clock(c.at)}</small></div>`).join('')}
            ${th.map(m=>`<div class="bub ${m.dir}">${esc(m.text)}<small class="num">${clock(m.at)}</small></div>`).join('')||(calls.length?'':'<p class="muted" style="text-align:center;margin:auto">No messages yet.</p>')}</div>
          ${codes.length?`<div class="row" style="gap:5px"><span class="note">Quick reply:</span>${codes.map(c=>`<button class="btn sm" data-act="smsQuick" data-t="${c}">${c}</button>`).join('')}</div>`:''}
          <div class="row" style="flex-wrap:nowrap"><input class="in" id="smsReply" data-oni="smsDraft" value="${esc(S.smsDraft)}" placeholder="Reply, e.g. ACK 4821" aria-label="Reply by SMS"><button class="btn pri" data-act="smsSend">Send</button></div></div></section>
      <section class="stack"><h2>Mailbox</h2><div class="card" style="padding:0;gap:0">
        ${S.emails.length?`<div class="mail">${S.emails.slice(0,6).map(m=>{const a=alertById(m.alert);return `<button class="mrow" data-act="mailSel" data-id="${m.id}" aria-pressed="${sel&&sel.id===m.id}"><b style="overflow-wrap:anywhere">${esc(a.title)}</b><span class="note num">${clock(m.at)}</span><span class="note">To ${esc(m.to)}</span></button>`;}).join('')}</div>
          <div class="mbody">${emailHtml(alertById(sel.alert),sel.to,true)}</div>`:'<p class="muted" style="padding:16px">No email sent yet. The Rates rule sends one for large rejected trades.</p>'}</div></section></div>
    <section class="card"><div class="row"><h2 class="grow">Delivery log</h2><span class="note">Latency is measured from the event arriving to the channel accepting the message.</span></div>
      <div class="scroll-x"><table><thead><tr><th>Time</th><th>Alert</th><th>To</th><th>Channel</th><th>Attempts</th><th>Status</th><th>Latency</th></tr></thead><tbody>
        ${S.notifs.slice(0,40).map(n=>{const a=alertById(n.alert);return `<tr><td class="num">${clock(n.at)}</td><td style="min-width:180px">${esc(a.title)}</td><td>${esc(n.to)}</td><td>${CH[n.channel]}${n.note?`<div class="note">${esc(n.note)}</div>`:''}</td><td class="num">${n.attempts}</td>
          <td>${chipHtml(n).replace(/>[^<]*·[^<]*· /,'>')}</td><td class="num">${n.latency!=null?nf(Math.round(n.latency))+' ms':'—'}</td></tr>`;}).join('')}</tbody></table></div></section>`;}

/* ---- connect a source ---- */
function snippet(src){const body=JSON.stringify(SAMPLES.unseen.raw);
  if(src==='kafka')return 'sources:\n  - id: scheduler-events\n    type: kafka\n    brokers: broker:9092\n    topic: scheduler.events\n    group: herald\n# then publish a test message:\necho \''+body+'\' | kcat -P -b broker:9092 -t scheduler.events';
  if(src==='logfile')return 'sources:\n  - id: scheduler-log\n    type: logfile\n    path: /var/log/scheduler/*.log\n    format: json   # one JSON object per line\n# then append a test line:\necho \''+body+'\' >> /var/log/scheduler/eod.log';
  return 'curl -X POST https://herald.example/ingest/webhook/scheduler \\\n  -H "X-Herald-Token: $HERALD_SOURCE_TOKEN" \\\n  -H "Content-Type: application/json" \\\n  -d \''+body+'\'';}
function viewConnect(){const o=S.ob;const ev=o.eventId&&S.events.find(e=>e.id===o.eventId);const done=!!o.alertAt;
  const clockTxt=o.t0?mmss((o.alertAt||Date.now())-o.t0):'00:00';const sug=batchRule(T().owner);
  const stp=(n,ok,html)=>`<section class="card ob"><div class="obn ${ok?'done':''}" aria-hidden="true">${ok?'✓':n}</div><div class="stack">${html}</div></section>`;
  let h=`<div class="row"><div class="grow"><h1>Connect a source</h1><p class="muted">From nothing to a first alert for ${esc(T().name)}. The event below uses a shape Herald has never seen.</p></div>
      <div class="stack" style="gap:2px;align-items:flex-end"><span class="lab">${done?'Time to first alert':'Elapsed'}</span><span class="clockbox" id="obClock">${clockTxt}</span></div></div>`;
  h+=stp(1,!!o.src,`<h2>Where do the events come from?</h2><div class="row">${[['webhook','HTTP webhook'],['kafka','Message broker (Kafka)'],['logfile','Log file']].map(s=>`<button class="btn" data-act="obSrc" data-src="${s[0]}" aria-pressed="${o.src===s[0]}" ${o.src===s[0]?'style="border-color:var(--accent);color:var(--accent)"':''}>${s[1]}</button>`).join('')}</div>`);
  if(o.src)h+=stp(2,!!o.gotAt,`<h2>Send one event</h2><pre id="snip">${esc(snippet(o.src))}</pre>
      <div class="row"><button class="btn sm" data-act="copy" data-src="snip">Copy</button>${o.gotAt?`<span class="wait got"><span class="dot"></span>First event received after ${mmss(o.gotAt-o.t0)}</span>`:`<span class="wait"><span class="dot pulse"></span>Waiting for the first event…</span><button class="btn pri" data-act="obSend">Send sample event</button>`}</div>
      ${o.gotAt?'':'<p class="note">The button stands in for running the command above.</p>'}`);
  if(ev){const flat=ev.flat;const used=p=>Object.keys(ev.paths).filter(k=>ev.paths[k]===p).map(cap).join(', ');
    h+=stp(3,true,`<h2>What Herald found in it</h2><div class="scroll-x"><table><thead><tr><th>Field</th><th>Kind</th><th>Example</th><th>Recognised as</th></tr></thead><tbody>
      ${Object.keys(flat).map(p=>`<tr><td class="mono">${esc(p)}</td><td>${typeOf(flat[p])}</td><td style="overflow-wrap:anywhere">${esc(vfmt(flat[p]))}</td><td>${used(p)||'<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table></div>
      <p class="note">${ev.attrs.severity===undefined?'No severity field was found, so the suggested rule sets one. ':''}Every field above can be used in a rule straight away.</p>`);
    if(o.preMatched)h+=stp(4,true,`<h2>A rule already matched</h2><p>An existing rule recognised this event, so the first alert is already in the feed.</p>`);
    else h+=stp(4,o.accepted,`<h2>Suggested rule</h2><p class="sentence">${esc(ruleSentence(sug))}</p>
      ${o.accepted?`<div class="row"><span class="wait got"><span class="dot"></span>Rule saved</span>${done?'':'<button class="btn pri" data-act="obSend">Send the event again</button>'}</div>`
        :`<div class="row"><button class="btn pri" data-act="obAccept" ${canEdit()?'':'disabled'}>Accept this rule</button><button class="btn" data-act="obEdit">Change it first</button>${canEdit()?'':'<span class="note">Saving rules needs a Rule editor or Team lead. <button class="btn link" data-act="becomeEditor">Switch</button></span>'}</div>`}`);}
  if(done)h+=stp(5,true,`<h2>First alert after ${mmss(o.alertAt-o.t0)}</h2><p>${esc(T().oncall)} has been ${T().personal?'texted':'called and texted'}, and the alert is in the feed.</p><div class="row"><button class="btn pri" data-act="nav" data-view="feed">See it in the live feed</button><button class="btn" data-act="obReset">Start over</button></div>`);
  else if(o.src)h+=`<div><button class="btn link" data-act="obReset">Start over</button></div>`;
  return h;}

function navHtml(){const open=S.alerts.filter(a=>a.owner===T().owner&&a.status==='firing').length;const wait=S.notifs.filter(n=>n.status==='retrying'||n.status==='parked').length;

function renderToasts(){$('toasts').innerHTML=S.toasts.map(t=>`<div class="toast" role="status"><span>${esc(t.text)}</span>${t.btn?`<button data-act="${t.btn.act}" data-id="${esc(t.btn.id)}">${esc(t.btn.label)}</button>`:''}</div>`).join('');}
const VIEWS={feed:viewFeed,rules:viewRules,runbooks:viewRunbooks,deliveries:viewDeliveries,preferences:viewPreferences,audit:viewAudit,connect:viewConnect};
function render(){
  const a=document.activeElement,fid=a&&a.id;let ss=null,se=null;try{ss=a.selectionStart;se=a.selectionEnd;}catch(e){}
